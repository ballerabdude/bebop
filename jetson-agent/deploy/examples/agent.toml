# /etc/bebop/agent.toml
#
# Reference config for bebop-agent (the on-robot provisioning daemon).
# This file ships as a template: every key is commented out, and the agent
# uses the compiled-in defaults from bebop-agent/src/config/mod.rs for
# anything you do not override here.
#
# Uncomment and edit a line only when you actually want to deviate from the
# default. Restart the service after editing:
#
#     sudo systemctl restart bebop-agent

# --- top-level ------------------------------------------------------------

# Human-readable robot identifier.
# Default: contents of /etc/hostname.
# robot_name = "bebop-lab-01"

# Persistent state / config directory (must be writable by the service).
# Default: "/var/lib/bebop"
# state_dir = "/var/lib/bebop"

# --- network / provisioning ----------------------------------------------
# [network]
#
# How the robot obtains connectivity:
#   "auto"   — join a known Wi-Fi network; fall back to the setup hotspot
#              if none connects within `ap_auto_after_secs`.
#   "client" — only ever act as a Wi-Fi client (never raise the hotspot).
#   "ap"     — always host the setup hotspot.
# Default: "auto"
# mode = "auto"
#
# SSID prefix for the setup hotspot. A short device id is appended, e.g.
# "Bebop-1a2b3c".
# Default: "Bebop"
# ap_ssid_prefix = "Bebop"
#
# WPA2 passphrase for the setup hotspot. Must be 8..=63 characters.
# Default: "bebopbebop"
# TODO: replace with a per-device derived code before shipping to customers.
# ap_password = "bebopbebop"
#
# In "auto" mode, how long to wait for a known network before raising the
# setup hotspot (seconds).
# Default: 25
# ap_auto_after_secs = 25
#
# Address the setup server binds. "0.0.0.0" listens on the LAN and the
# setup hotspot; "127.0.0.1:9091" restricts it to the robot itself.
# Default: "0.0.0.0:9091"
# setup_bind_addr = "0.0.0.0:9091"
