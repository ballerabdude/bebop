# orbbec_rig.yaml — measured once per robot; source of truth for extrinsics
# (docs/navd.md Section 6.2). Convention: pitch_deg negative = camera center
# points below the horizon. Body frame: x forward, y left, z up; camera
# optical frame: x right, y down, z forward.
#
# depth_profile is the *preferred* profile; the camera service negotiates
# down to what the device advertises.
#
# Both cameras run 848x480@30 (a hardware-synced pair, so both rates match).
# The old 15 fps choice was dictated by the Orin Nano's GIL cliff with the
# (now-removed) BEV worker; on the Thor, with BEV excised, the recorder
# sustains ~28.8 Hz at 30+30 (measured 2026-10-01: dt median 33.4 ms,
# p95 40 ms, one 128 ms hitch over 8 s).
robots:
  default:
    cameras:
      CPBLC53000PE:
        role: near
        height_m: 1.27
        pitch_deg: -66.0
        yaw_deg: 0.0
        # 30 fps, matched across the hardware-synced primary+secondary pair
        # (see header note).
        depth_profile: [848, 480, 30]
        # Depth preset (set at open; resets to "Default" on power cycle).
        # Supersedes the old depth_work_mode (presets bundle their own work
        # mode). Built-in "High Accuracy" replaces "High Density" (user
        # choice 2026-09-07); the G33X custom preset bin is Gemini 330-only
        # (firmware rejects with ERR_MISMATCH on the 335Lg).
        depth_preset: High Accuracy
        # Camera's hardware JPEG encoder: color arrives pre-encoded and the
        # recorder stores it verbatim (saves ~65 ms/tick of CPU encode vs
        # RGB + re-encode; the capture threads also shed their decode work).
        color_format: mjpg
        # Host-side SDK depth post-filters (run on the Jetson, not the
        # camera).  The near camera is the obstacle/drop authority, so
        # false positives matter more than holes: measured with
        # tools/orbbec_depth_tune.py (2026-10-22, robot still, 2.5 s per
        # set) HoleFilling invents 4-7 raised points per frame (max 27)
        # that read as obstacles within 1.2 m -- one inside the corridor
        # brakes the driver -- while any set without it gives zero.
        # [noise, temporal]: 0 phantom points, 0.7/1.3 mm floor noise at
        # 0.5-1 / 1-1.7 m, 87.5% valid.  (With hole: 97.8% valid but 3.9
        # phantoms/frame; the old [temporal, hole]: 7.1/frame.)
        depth_filters: [noise, temporal]
        # Range clip for the near camera (it only serves 0.2-2.5 m; beyond
        # that the far camera is the authority).  The 335Lg rejects the
        # device MIN/MAX depth properties, so orbbec.py applies this with
        # the SDK ThresholdFilter.  Measured: no change in noise or
        # phantoms at rest; it just drops far returns.  Device noise
        # removal (max_speckle_size 80, max_diff 256) measured no better
        # at 200/400 and 128, so it keeps the preset values.
        depth_range_mm: [150, 2500]
        # Camera IMU (accel + gyro) captured into the session MCAP as a VIO
        # input. Rates: 50/100/200/500/1000 Hz; the device clock is shared
        # with depth/color (tools/orbbec_imu_probe).
        imu: true
        imu_hz: 200
        # Self-view mask shapes in DEPTH coordinates (848x480) — orbbec.py
        # zeroes these pixels before the frame is published. Two forms per
        # entry, mix freely:
        #   - [x0, y0, x1, y1]        rect
        #   - [[x, y], [x, y], ...]   polygon (>= 3 vertices)
        # The chassis silhouette is a trapezoid (wider at the bottom), so a
        # polygon hugs it without masking the floor a rect would cover.
        # Draw shapes with tools/set_self_mask.py on the workstation
        # (fetches the live color view, converts to depth coords via the
        # color->depth extrinsic, prints this snippet).
        # History: the first rects were color-space (1280x800) values and
        # clipped against the depth frame, masking floor right of the
        # chassis while leaving the chassis itself unmasked. Tightened
        # 2026-09-07 against a live snapshot overlay — the old top/right
        # edges masked ~18 px of actionable floor (0.6-0.7 m ahead) that
        # the label fusion turned into permanent caution cells. Later on
        # 2026-09-07 the rect became a polygon (tools/set_self_mask.py):
        # the chassis is a trapezoid, the rect was masking floor at the
        # top corners and both sides.
        # The rigid mount keeps these pixels fixed.
        # Keep the chassis polygon for consumers that need to exclude self
        # pixels (fuse_navd_labels), but do not zero the published depth:
        # the master BEV's body-frame robot.self_mask removes chassis points,
        # and the color/depth views stay complete for comparison.
        zero_self_pixels: false
        self_mask_pixels:
          - [[352, 238], [329, 479], [273, 479], [657, 479], [566, 479], [524, 240], [352, 238]]
      CPBLC53000ED:
        role: far
        height_m: 1.32
        pitch_deg: -17.4
        yaw_deg: 0.0
        # Match the primary's rate for hardware sync (Orbbec multi-camera
        # sync, Primary + Secondary-synced, delays 0); 30 fps absorbs the
        # horizon motion the old 10 fps workaround was trading away.
        depth_profile: [848, 480, 30]
        depth_preset: High Accuracy
        color_format: mjpg
        depth_filters: [temporal, hole]
        imu: true
        imu_hz: 200
    bev:
      range_m: 3.0        # forward horizon
      width_m: 3.0        # lateral span (-1.5..+1.5)
      cell_m: 0.05        # 60x60 cells
      near_authority_m: 1.5
      # Body-frame dead disc: chassis-silhouette stereo artifacts sit just
      # outside the self-view mask; nothing inside this radius is
      # actionable (planner rays start at 0.35 m).
      min_range_m: 0.55
    # Learned master-BEV student (docs/bev-student.md).  SAM 3.1 is the
    # offline semantic teacher; these knobs shape its depth-fused labels.
    # The grid is 120x60, row 0 far, col 0 right.  The live BEV is model-only;
    # `geometry` is used by the offline label/training tools.
    bev_student:
      grid:
        range_m: 6.0
        width_m: 3.0
        cell_m: 0.05
      geometry:
        min_range_m: 0.55
        max_range_m: 8.0
        stride_x: 4
        stride_y_near: 2
        stride_y_far: 1
        near_range_m: [0.55, 1.20, 2.00]
        far_range_m: [1.00, 2.00, 4.50, 7.00]
        floor_band_m: 0.40
        noise_scale: 0.01
      label:
        # Per-cell weighted-evidence thresholds.
        floor_min_w: 0.40
        wall_min_w: 0.35
        obstacle_min_w: 0.35
        hazard_min_w: 0.50
        # Weak depth-only floor vote in cells where SAM returned no mask at
        # all; SAM remains the semantic source.  Set 0 to require a SAM mask.
        depth_floor_weight: 0.25
        # A compact, short wall component is a solid object (bookshelf
        # edge), not a wall; tall pillars stay walls.
        wall_compact_m: 0.60
        wall_pillar_min_h_m: 2.00
        # Local floor-height differences (rug/step edges) are noisy
        # indoors; below-plane depth is the primary hazard signal.
        local_drop_hazard: false
        # Require the below-plane point itself to be SAM floor/ground or
        # stairs/hole; dark furniture undersides and shadows are not holes.
        hazard_require_floor: true
        floor_tol_m: 0.04
        wall_min_h_m: 0.80
        wall_max_h_m: 2.50
        occ_min_m: 0.03
        occ_max_m: 1.50
        # Near-body cull: depth is dropped only inside the learned chassis
        # footprint (ego.mask_file below) dilated by this margin, so the
        # floor right beside the wheels stays labelled.  The earlier hand
        # rectangle [-0.30, 0.37, -0.35, 0.25] (cull_rect_m) was 8-17 cm
        # larger than the body on every side and left a never-labelled band
        # around the chassis that the model filled with neighbouring
        # obstacles (2026-10-19).  cull_rect_m still works as a fallback
        # when no ego raster exists; unset both to get the 0.55 m disc back.
        cull_ego_margin_m: 0.02
        # Below-plane depth within this distance of the footprint is not a
        # drop: pixels on the chassis rails' silhouette edge mix rail and
        # floor depth and land 5-8 cm under the plane just outside the
        # body (an orange strip along the left rail in 83 % of frames,
        # 2026-10-20).  A real drop that close to the wheels is behind the
        # frame and invisible to the near camera anyway.
        hazard_ego_margin_m: 0.15
      ego:
        # Learned chassis footprint (tools/bev_ego_from_data.py): a 1 cm
        # body-frame raster next to this file, built from the robot's own
        # recordings -- cells that hold above-floor depth in nearly every
        # frame are the body, never-observed cells beside it are the floor
        # the body hides (wheels, underbody).  Read by the labeler AND the
        # live runtime; when present it replaces the rectangle below, which
        # stays as the fallback.  Rebuild after any chassis/camera change.
        # 2026-10-19 (633 frames): body seen x -0.11..+0.30, y -0.21..+0.10;
        # footprint x -0.13..+0.32, y -0.34..+0.19 m (0.45 x 0.53 m).
        mask_file: ego_mask.npz
        # Live guard matching label.hazard_ego_margin_m: a predicted drop in
        # this ring around the chassis becomes the model's best other class.
        hazard_pad_m: 0.15
        # Fallback rectangle in the body frame (x forward from the
        # camera mast, y left).  Read by the offline labeler (ego layer) AND
        # by the live runtime, which ORs this static rectangle onto the
        # model's predicted ego every frame -- keep them the same numbers.
        # Measured 2026-10-19 from the near camera's depth across all six
        # drives: the frame top (0.58 m up) spans x -0.10..+0.29,
        # y -0.20..+0.09, i.e. the body is 0.40 m long x 0.29 m wide, centred
        # 10 cm ahead of and 5 cm right of the mast.  Width here is widened
        # to the 0.44 m the previous entry carried (wheels outside the frame),
        # centred on the measured body.  The old [0.0, 0.55] forward range
        # covered 25 cm of floor in front of the body that the near camera
        # cannot see past the frame; that is unobserved, not chassis.
        # Verify against the physical robot: overall width incl. wheels,
        # mast-to-front and mast-to-rear distance, lateral mast offset.
        x_range_m: [-0.10, 0.29]
        y_range_m: [-0.27, 0.17]
    robot:
      radius_m: 0.20      # inflation radius for planning
      # Self-view mask: the mast cameras see the robot's own chassis at
      # fixed body-frame positions; those returns are dropped before
      # classification. Measured 2026-09-05 from the mounted rig (mast
      # strip at y~-0.1, frame rails to y +0.5 / x +0.9).
      self_mask:
        x_range_m: [-0.30, 1.00]
        y_range_m: [-0.30, 0.60]
        min_height_m: 0.05
    safety:
      max_frame_age_s: 0.3
      plane_min_inliers: 50
      # The far camera sees less floor (wall-heavy scenes) — a lower floor
      # fraction still qualifies its plane fit.
      plane_min_frac: 0.10
      plane_residual_m: 0.015
      hazard_drop_m: 0.05
