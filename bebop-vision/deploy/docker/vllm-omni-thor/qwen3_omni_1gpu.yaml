# Qwen3-Omni-MoE production deploy, verified on 2x H100 (stage 0 on cuda:0,
# stages 1+2 on cuda:1).
#
# Fields omitted from a stage fall back to StageDeployConfig defaults (see
# vllm_omni/config/stage_config.py). Notable implicit defaults for this
# model:
#   * Stages 0/1 (thinker, talker) do not set max_num_batched_tokens —
#     chat-sized prefill fits in the 32768 default.
#   * Stages 0/1 do not set enforce_eager — cudagraph runs by default
#     (false). Stage 2 (code2wav) sets true because its generation loop
#     is cudagraph-incompatible.
#   * Platform sections flip enforce_eager per-stage where platform
#     cudagraph support differs.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      # Frames the Talker->Code2Wav stage buffers before emitting audio. At 25
      # (~2 s of codec at ~12.5 Hz) the first audio only lands ~2 s in, well
      # after the (fast MoE) thinker has streamed all its text. 8 -> first audio
      # in ~0.6 s. `codec_left_context_frames` still gives the decoder 25 frames
      # of context. See docs/vllm-omni.md ("speech lags the text").
      codec_chunk_frames: 8
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.62
    trust_remote_code: true
    enable_prefix_caching: false
    enforce_eager: true
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.12
    trust_remote_code: true
    enable_prefix_caching: false
    enforce_eager: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 64
    gpu_memory_utilization: 0.04
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1

