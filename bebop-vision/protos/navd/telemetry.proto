syntax = "proto3";

package bebop.navd;

// Operator teleop twist (the imitation label).
message Twist {
  double vx = 1;
  double wz = 2;
  int64 stamp_ns = 3;
}

// Wheel odometry in the odom frame.
message Odom {
  double x = 1;
  double y = 2;
  double theta = 3;
  int64 stamp_ns = 4;
}

// Camera IMU sample (one axis triad). `stamp_ns` is the host epoch time
// assigned at record time (MCAP log_time); `device_stamp_us` is the camera
// device clock the accel/gyro/depth streams share, kept for offline VIO
// fusion. The IMU is a fusion input, not pose ground truth.
message ImuAccel {
  double ax = 1;
  double ay = 2;
  double az = 3;
  int64 stamp_ns = 4;
  int64 device_stamp_us = 5;
}

message ImuGyro {
  double gx = 1;
  double gy = 2;
  double gz = 3;
  int64 stamp_ns = 4;
  int64 device_stamp_us = 5;
}

// Operator-declared mission for the current segment ("living room ->
// kitchen"). Sticky: the recorder writes it at segment start and whenever
// it changes, so every file carries the intent it was driven under.
// A run is one attempt at a task: `run_id` ("r" + local YYYYMMDD_HHMMSS +
// "_" + 4 hex) groups the segments of that attempt, so two runs with the
// same text stay apart. `task` is one of the fixed vocabulary in
// bebop_vision/session_notes.py (TASKS), `target` its argument. Files
// written before these fields existed decode them as "" / 0.
message Intent {
  string text = 1;
  string from_place = 2;
  string to_place = 3;
  int64 stamp_ns = 4;
  string task = 5;
  string target = 6;
  string run_id = 7;
  int64 run_started_ns = 8;
}

// Operator marker during a drive: a planted obstacle, a recovery start, a
// stretch to exclude. `kind` is a short token, `note` free text.
message Event {
  string kind = 1;
  string note = 2;
  int64 stamp_ns = 3;
}

// A confirmed place recognised by the 1 Hz scout (DINOv3 match), logged so
// a drive carries its own from/to anchors for place-graph edge tracks.
message PlaceSeen {
  string place_id = 1;
  string name = 2;
  double score = 3;
  double margin = 4;
  int64 stamp_ns = 5;
}
