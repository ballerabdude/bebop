name: vLLM-Omni Thor image

# Builds the custom vLLM-Omni (sm_110) image on GitHub's native arm64 runners
# and publishes it to GHCR, so the Thor can `docker pull` instead of building
# (a ~20-40 min job). Reproduce locally with:
#   docker pull ghcr.io/ballerabdude/bebop-vllm-omni-thor:latest
#
# Trigger: manual dispatch, a `vllm-omni-*` tag, or a change to the Dockerfile.

on:
  workflow_dispatch:
  push:
    tags:
      - "vllm-omni-*"
    branches:
      - main
    paths:
      - "bebop-vision/deploy/docker/vllm-omni-thor/**"
      - ".github/workflows/vllm-omni-thor.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64 runner avoids QEMU emulation for the aarch64 base image.
    # (Fallback: ubuntu-latest + docker/setup-qemu-action if arm runners are
    # unavailable in this org.)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: bebop-vision/deploy/docker/vllm-omni-thor
          file: bebop-vision/deploy/docker/vllm-omni-thor/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bebop-vllm-omni-thor:latest
            ghcr.io/${{ github.repository_owner }}/bebop-vllm-omni-thor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
