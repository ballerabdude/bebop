# bebop-models supervisor registry.
#
# Edge-LLM is the robot's only generative runtime: every generative backend is
# a `tensorrt-edgellm-serve` process (a checkpoint + an engine cache + a port).
# See docs/models.md and bebop_vision/edge_serve.py.
#
# Each backend is one of:
#   edgellm  - a `tensorrt-edgellm-serve` child this service starts/stops
#   external - an already-running OpenAI-compatible server (base_url); debug only
#   tracked  - runs inside another process (bebop-vision); counted, not managed
#
# footprint_gb informs the GPU budget; before loading, the supervisor evicts
# ready residents until the new backend fits (see GPU_BUDGET_GB).
backends:
  - id: omni-edgellm
    purpose: voice
    kind: edgellm
    footprint_gb: 20
    # The NVFP4 checkpoint the `--quantize-voice` installer step produces from
    # the catalog's `qwen3-omni-30b` snapshot.
    model: /home/bebop/bebop/bebop-vision/weights/qwen3-omni-30b-nvfp4
    # Ahead-of-time TensorRT engines. The first start builds them (tens of
    # minutes); later starts are deserialization (~40 s).
    cache_dir: /var/lib/bebop-voice/edgellm
    port: 8000
    serve_args:
      # Parse the model's XML tool calls into OpenAI `tool_calls`.
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"

  # A second generative backend slots in the same way — e.g. the cascade's
  # brain: `kind: edgellm`, `model: RadixArk/Qwen3.8-27B-NVFP4`, `port: 8012`.
  # The voice service supervises the cascade stages itself today (`StageServer`);
  # registering them here hands their lifecycle to this service.

  - id: vision
    purpose: vision
    kind: tracked
    footprint_gb: 6
    note: "navd/DINOv3 inside bebop-vision (camera-coupled; not managed here)"
