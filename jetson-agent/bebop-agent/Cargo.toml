[package]
name = "bebop-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "On-device provisioning daemon for Bebop robots: Wi-Fi setup and SoftAP fallback."

[[bin]]
name = "bebop-agent"
path = "src/main.rs"

[dependencies]
bebop-proto = { workspace = true }

tokio   = { workspace = true }
futures = { workspace = true }

anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
toml  = { workspace = true }

# Setup server: protobuf-over-WS control surface + status page.
axum       = { workspace = true }
tower-http = { workspace = true }

[features]
default = []
