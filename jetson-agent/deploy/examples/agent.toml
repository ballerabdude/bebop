# /etc/bebop/agent.toml
#
# Reference config for bebop-agent (the on-robot provisioning daemon).
# This file ships as a template: every key is commented out, and the agent
# uses the compiled-in defaults from bebop-agent/src/config/mod.rs for
# anything you do not override here.
#
# Uncomment and edit a line only when you actually want to deviate from the
# default. Restart the service after editing:
#
#     sudo systemctl restart bebop-agent

# --- top-level ------------------------------------------------------------

# Human-readable robot identifier.
# Default: contents of /etc/hostname.
# robot_name = "bebop-lab-01"

# Persistent state / config directory (must be writable by the service).
# Default: "/var/lib/bebop"
# state_dir = "/var/lib/bebop"

# --- network --------------------------------------------------------------
# [network]
#
# Network mode, a two-way switch with NO automatic fallback:
#   "ap"     — Hosted Network: the robot hosts its own hotspot and waits
#              for a device to connect. This is the boot default so a
#              fresh robot is reachable at 192.168.42.1:9091.
#   "client" — Known Network: the robot joins a saved Wi-Fi network and
#              never hosts.
# Changed by the physical button long-press (see [button] below), not by
# the app.
# Default: "ap"
# mode = "ap"

# SSID broadcast by the Hosted Network hotspot. Also editable from the app.
# Default: "Bebop-<first 6 chars of /etc/machine-id>"
# ap_ssid = "Bebop-lab"

# WPA2 passphrase for the hotspot (must be 8..=63 chars). Also editable
# from the app (leave the app field blank to keep the current value).
# Default: "bebopbebop"
# TODO: replace with a per-device derived code before shipping to customers.
# ap_password = "bebopbebop"

# Hotspot band: "2.4" or "5". 2.4 GHz is the safe default; 5 GHz may need a
# regulatory domain (`iw reg set <CC>`) and can be blocked on DFS channels.
# Default: "2.4"
# ap_band = "2.4"

# Address the setup server binds. "0.0.0.0" listens on the Hosted Network
# and the LAN; "127.0.0.1:9091" restricts it to the robot itself.
# Default: "0.0.0.0:9091"
# setup_bind_addr = "0.0.0.0:9091"

# --- mode button ----------------------------------------------------------
# A momentary switch between the GPIO pin and GND. A long press toggles
# between Hosted Network (ap) and Known Network (client). On the Orin Nano
# 40-pin header, pin 29 is gpiochip0 line 105 and idles low, so wire the
# switch from pin 29 to 3.3 V (pins 1/17) and keep button_active_low=false
# (avoid pins 7 and 15, which the IMU uses).
#
# button_enabled = true
# button_chip = "gpiochip0"
# button_line = 105          # header pin 29 (GPIO01)
# button_active_low = false  # switch ties the line to 3.3 V when pressed
# button_bias = "pull-down"  # pull-down | pull-up | none (pinmux wins on Jetson)
# button_hold_secs = 5       # long-press duration
