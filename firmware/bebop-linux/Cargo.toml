[package]
name = "bebop-linux"
version = "0.1.0"
edition = "2021"
authors = ["Bebop Bot Team"]
description = "Linux runtime for the Bebop robot: a SocketCAN motor/wheel supervisor behind an Idle / DialIn protobuf-over-WebSocket API."

[lib]
name = "bebop_linux"
path = "src/lib.rs"

[[bin]]
name = "bebop-linux"
path = "src/main.rs"

# Single-joint actuator system-identification driver. Reuses the motor
# stack (RobotConfig + CanInterface + RobstrideMotor) but bypasses the
# Supervisor/WS server so it can command full MIT-mode kp/kd/torque/velocity
# excitation and log synchronized feedback to CSV for offline fitting of the
# Isaac Lab DCMotorCfg params. See `src/bin/sysid.rs` for usage and
# `sim/bebop_training/tools/sysid_fit.py` for the fitter.
[[bin]]
name = "sysid"
path = "src/bin/sysid.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "time", "sync", "signal", "net", "macros"] }
futures = "0.3"

# CAN bus
socketcan = "3.3"

# HTTP + WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Math (IMU mount rotation)
nalgebra = "0.32"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Time handling
chrono = "0.4"

# Low-level POSIX scheduling + clocks for the real-time control loop
# (`src/realtime.rs`): SCHED_FIFO and absolute-deadline `clock_nanosleep`
# on CLOCK_MONOTONIC; also `statvfs` for the disk-free readings
# (`src/model.rs`, `src/system_capture.rs`). Already present transitively
# (socketcan, mcap, ...); pinned here as a direct dependency since the
# firmware calls it explicitly.
libc = "0.2"

# Wire protocol shared with the operator app and bebop-agent.
bebop-proto = { path = "../../jetson-agent/bebop-proto" }
prost = "0.13"
bytes = "1.7"

# MCAP capture format for the always-on 1 Hz power/host system log
# (see `src/system_capture.rs`). MCAP gives us:
#   * a single self-describing binary file (embedded protobuf FDS) that
#     Rerun / Foxglove / `mcap-cli` read out of the box;
#   * built-in chunked compression, so days of samples stay small;
#   * stable per-message timestamps, so the system timeline can be scrubbed
#     next to a drive session without our own parser.
# The writer only uses Zstd chunks and the firmware never decodes another
# producer's MCAP, so the default `lz4` feature (a vendored C build) is off.
mcap = { version = "0.25", default-features = false, features = ["zstd"] }

# USB-serial reader for the Teensy `teensy_bridge` backend (`imu_serial.rs`).
# `default-features = false` drops the libudev-based port *enumeration*
# (which we don't use — we open a known `/dev/ttyACM*` path) so the crate
# cross-compiles for the Jetson (aarch64) without a libudev dependency.
serialport = { version = "4", default-features = false }

# Argument parsing for the `sysid` binary. Pulled in via the `derive`
# feature so it can declare its CLI as a struct.
clap = { version = "4", features = ["derive"] }

[build-dependencies]
# Generates the `bebop.system.*` types from `protos/system.proto` and the
# serialized FileDescriptorSet embedded in the always-on system MCAP
# (`src/system_capture.rs`). Same version as `bebop-proto`.
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
