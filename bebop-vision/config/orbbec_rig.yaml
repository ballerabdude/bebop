# orbbec_rig.yaml — measured once per robot; source of truth for extrinsics
# (docs/navd.md Section 6.2). Convention: pitch_deg negative = camera center
# points below the horizon. Body frame: x forward, y left, z up; camera
# optical frame: x right, y down, z forward.
#
# depth_profile is the *preferred* profile; the camera service negotiates
# down to what the device advertises.
#
# Far camera runs at 10 fps (full 848x480) even though the swapped USB 3
# cable now advertises 30 fps: with both cameras filtering 848x480@30 the
# SDK filter chains starve the GIL and the BEV worker collapses to ~1 Hz
# (measured 2026-09-06); far@10 restores ~9 Hz fused grids (near@30). The
# far camera feeds the 1.5-3 m horizon at a 10 Hz BEV tick, so 10 fps is
# sufficient (4 cm of travel between frames at v_max 0.4 m/s).
robots:
  default:
    cameras:
      CPBLC53000PE:
        role: near
        height_m: 1.27
        pitch_deg: -66.0
        yaw_deg: 0.0
        # 15 fps: hardware-sync requires matching depth/color rates across
        # the primary+secondary pair (see far camera note); 15 fps keeps the
        # SDK filter load under the GIL cliff while phase-locking the pair.
        depth_profile: [848, 480, 15]
        # Camera's hardware JPEG encoder: color arrives pre-encoded and the
        # recorder stores it verbatim (saves ~65 ms/tick of CPU encode vs
        # RGB + re-encode; the capture threads also shed their decode work).
        color_format: mjpg
        # Self-view rects (x0, y0, x1, y1 px) in DEPTH coordinates (848x480):
        # the chassis frame, measured 2026-09-06 from live close-range
        # (<1.05 m) silhouette intersected over frames + 12 px margin.
        # NOTE: the previous rects were color-space (1280x800) values and
        # clipped against the depth frame, masking floor right of the
        # chassis while leaving the chassis itself unmasked.
        # The rigid mount keeps these pixels fixed.
        self_mask_pixels:
          - [340, 215, 570, 480]
      CPBLC53000ED:
        role: far
        height_m: 1.32
        pitch_deg: -17.4
        yaw_deg: 0.0
        # 15 fps (was 10): must match the primary's rate for hardware sync
        # (Orbbec multi-camera sync, Primary + Secondary-synced, delays 0).
        # Both at 30 starves the GIL -> BEV ~1 Hz (measured 2026-09-06);
        # 15+15 keeps the filter load at 30 frames/s total, below that cliff,
        # and far gains 50% data rate vs the old 10 fps.
        depth_profile: [848, 480, 15]
        color_format: mjpg
    bev:
      range_m: 3.0        # forward horizon
      width_m: 3.0        # lateral span (-1.5..+1.5)
      cell_m: 0.05        # 60x60 cells
      near_authority_m: 1.5
      # Body-frame dead disc: chassis-silhouette stereo artifacts sit just
      # outside the self-view mask; nothing inside this radius is
      # actionable (planner rays start at 0.35 m).
      min_range_m: 0.55
    robot:
      radius_m: 0.20      # inflation radius for planning
      # Self-view mask: the mast cameras see the robot's own chassis at
      # fixed body-frame positions; those returns are dropped before
      # classification. Measured 2026-09-05 from the mounted rig (mast
      # strip at y~-0.1, frame rails to y +0.5 / x +0.9).
      self_mask:
        x_range_m: [-0.30, 1.00]
        y_range_m: [-0.30, 0.60]
        min_height_m: 0.05
    safety:
      max_frame_age_s: 0.3
      plane_min_inliers: 50
      # The far camera sees less floor (wall-heavy scenes) — a lower floor
      # fraction still qualifies its plane fit.
      plane_min_frac: 0.10
      plane_residual_m: 0.015
      hazard_drop_m: 0.05
