[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bebop-vision"
version = "0.1.0"
description = "Perception stack for the bebop robot: MCAP recorder, WebRTC operator video, place memory, voice gateway and offline SAM 3.1 labeling tools"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python>=4.10.0",
    "protobuf>=4.25",
    "mcap>=1.4",
    "pyyaml>=6",
    "huggingface_hub>=0.26.0",
    "torch>=2.5",
    "transformers>=4.55",
    "websockets>=12",
]

[project.optional-dependencies]
# Jetson-only: the Orbbec camera SDK. Deliberately NOT a base dependency and
# not in requirements.txt — it hard-pins av==12.3.0 while
# tensorrt-edgellm[server] hard-pins av==17.1.0, so no single resolution can
# hold both. `install-jetson.sh --setup-voice` installs it with `--no-deps`;
# the robot uses it for capture only. See bebop-vision/requirements.txt.
jetson = [
    "pyorbbecsdk2==2.1.2",
]
teacher = [
    "einops",
    "onnx",
    "pillow>=10",
    "pycocotools",
    "tensorrt>=11.0",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
]
# Workstation-side offline tools: PyAV decodes the recorder's H.265 color
# (tools/mcap_extract.py). On the robot `tensorrt-edgellm[server]` pins av
# already (requirements.txt), so it stays out of the main dependency set.
tools = [
    "av>=12",
]
# HTTP services: the voice gateway (bebop_vision/voice_server.py) and the
# bebop-models supervisor (bebop_vision/models_supervisor.py) run on FastAPI
# + uvicorn and call their model servers over httpx. On the robot
# `tensorrt-edgellm[server]` (requirements.txt) pulls these in; a
# workstation venv needs this extra, or the voice and supervisor tests skip.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]
# Workstation model-development lab (bebop_vision/lab): sessions as aligned
# numpy, the architecture registry, labels, training, Rerun views. rerun-sdk
# must match the installed viewer (scripts/setup-rerun.sh RERUN_VERSION).
lab = [
    "av>=12",
    "polars>=1.0",
    "timm>=1.0.20",
    "onnx",
    "onnxruntime",
    "rerun-sdk==0.31.3",
    "marimo",
]

[tool.setuptools.packages.find]
include = ["bebop_vision*"]