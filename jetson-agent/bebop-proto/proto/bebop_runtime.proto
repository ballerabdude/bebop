// Bebop runtime API — bidirectional protobuf-over-WebSocket between the
// Tauri operator app and `bebop-linux` running on the robot.
//
// This file is intentionally separate from `bebop.proto`: that one is the
// BLE control surface (one-shot request/response, small messages, used for
// setup/provisioning), while this one is a streaming bidirectional API
// for live motor control + telemetry over a TCP/WS link.
//
// Codegen: `prost-build` picks this up via the glob in `build.rs`; the
// Tauri app picks it up via `npm run gen-proto` which runs buf over the
// containing directory.

syntax = "proto3";

package bebop.runtime.v1;

// ---------------------------------------------------------------------------
// Envelope: every WS frame is one of these (length-prefixed binary protobuf).
// ---------------------------------------------------------------------------

// Client (operator app) -> server (bebop-linux) on the robot.
message ClientRuntimeMessage {
  // Optional correlation id; server echoes it back in Ack/Error so the
  // client can match responses to requests. Telemetry frames carry 0.
  uint32 request_id = 100;

  oneof payload {
    SubscribeTelemetry  subscribe_telemetry    = 1;
    UnsubscribeTelemetry unsubscribe_telemetry = 2;
    GetSnapshot         get_snapshot           = 3;
    SetMotorEnabled     set_motor_enabled      = 4;  // single joint
    SetAllMotorsEnabled set_all_motors_enabled = 5;
    SetMode             set_mode               = 6;
    EmergencyStop       emergency_stop         = 7;
    ResetEStop          reset_estop            = 8;
    // Position-limit dial-in: command a hold target for an armed motor in
    // DIAL_IN mode. Used by the operator app's slider to discover the
    // mechanical envelope before raising hard_limits in the YAML.
    SetMotorTarget      set_motor_target       = 9;
    // Re-zero a single motor's mechanical origin to its current physical
    // position. Used after reassembly when the joint's reported position
    // no longer reflects mechanical neutral (e.g. encoder absolute origin
    // ended up outside the safety envelope so the supervisor refuses to
    // arm). Persisted in the motor's flash; effective immediately.
    SetMechanicalZero   set_mechanical_zero    = 10;
    // Toggle the policy "dry run" flag. When enabled, RUN_POLICY still
    // builds observations, runs ONNX inference, publishes telemetry, and
    // captures samples — but instead of applying the policy's PD command
    // the supervisor sends a hold-gains keepalive each tick (same shape
    // as DialIn's hold cycle). The robot freezes in its current posture
    // and the Robstride feedback watchdog stays alive. Used for bench
    // observation / noise capture without physically driving the
    // actuators. The flag persists across mode transitions; clear it
    // explicitly when you want the policy to drive motors again.
    SetPolicyDryRun     set_policy_dry_run     = 11;
    // Tag 12 was `SetPolicyCapture`, the operator-toggled MCAP capture
    // request. Capture is now always-on while the runtime is in
    // DIAL_IN or RUN_POLICY (the firmware auto-rotates the file on
    // size and prunes oldest segments under a disk budget — see
    // `firmware/bebop-linux/src/policy_capture.rs`), so the toggle no
    // longer exists. Reserved so this tag isn't accidentally re-used
    // by a different message with the same id.
    //
    // Batch variant of SetMechanicalZero for the guided zero-calibration
    // flow in the operator app: the robot is placed in the reference pose
    // (face-flat on the floor, both legs straight) with every joint
    // disarmed, and one request re-zeroes all actuators. The firmware
    // enforces the per-joint preconditions atomically *before* touching
    // any motor (no E-STOP, every joint disarmed, every bus healthy), so
    // a half-armed robot can't end up with a mixed set of origins.
    // Robstride motors intermittently lose their stored origin across a
    // power cycle, so this flow is part of normal pre-flight, not just
    // reassembly.
    SetMechanicalZeroAll set_mechanical_zero_all = 13;
    // Wheeled differential-drive chassis commands (no-op on the humanoid,
    // which has no `wheels:`/`drive:` in its YAML).
    //
    // Drive a twist (body-frame forward + yaw rate) into the wheel axes;
    // the firmware clamps, slew-limits, and converts to per-wheel velocity.
    SetVelocityCommand   set_velocity_command   = 14;
    // Arm/disarm a single ODrive wheel (name matches the `wheels:` YAML).
    SetWheelEnabled      set_wheel_enabled      = 15;
    // Arm/disarm every configured wheel at once.
    SetAllWheelsEnabled  set_all_wheels_enabled = 16;
    // Reset the wheel-encoder odometry pose to the origin.
    ResetOdometry        reset_odometry         = 17;
    // Run the ODrive FULL_CALIBRATION_SEQUENCE on one disarmed wheel
    // (motor + encoder offset; the axis spins for ~20-30 s). Recovers a
    // wheel whose encoder calibration was lost. Result is NOT saved to
    // the S1's NVM — it must be re-run after a power cycle, or persisted
    // once via `odrivetool` → `save_configuration()` over USB.
    CalibrateWheel       calibrate_wheel       = 18;
    // Deprecated (plan §9): the OBSBOT camera gimbal is removed. The
    // firmware acks this as a no-op; the field is kept for wire
    // compatibility and reserved against reuse in a future revision.
    SetCameraPose        set_camera_pose       = 19 [deprecated = true];
    // Deprecated (plan §9): the legacy navseg mask push is removed —
    // no firmware handler, nothing is ever pushed. Kept for wire
    // compatibility.
    SubscribeNav         subscribe_nav         = 20 [deprecated = true];
    UnsubscribeNav       unsubscribe_nav       = 21 [deprecated = true];
  }
  reserved 12;
  reserved "set_policy_capture";
}

// Server -> client. Streamed; not all messages are responses to a request.
message ServerRuntimeMessage {
  // Echoed from the corresponding ClientRuntimeMessage, or 0 for
  // unsolicited (e.g. periodic telemetry, async E-STOP latch events).
  uint32 request_id = 100;

  oneof payload {
    Ack                 ack             = 1;
    Error               error           = 2;
    Snapshot            snapshot        = 3;
    TelemetryFrame      telemetry       = 4;  // ~30 Hz when subscribed
    ModeChanged         mode_changed    = 5;
    EStopLatched        estop_latched   = 6;
    BusStatusUpdate     bus_status      = 7;
    // Deprecated (plan §9): the legacy navseg runner that produced these
    // masks is removed — the firmware never pushes this. Kept for wire
    // compatibility.
    NavMaskFrame        nav_mask        = 8 [deprecated = true];
  }
}

// ---------------------------------------------------------------------------
// Operating mode
// ---------------------------------------------------------------------------

enum Mode {
  MODE_UNSPECIFIED  = 0;
  // Motors disabled. Telemetry still streams (so the operator can see
  // current pose). Mode at boot.
  MODE_IDLE         = 1;
  // Per-motor enable/disable, hold-gain TX cycle, slew limit + watchdog
  // enforced. Used during dial-in / bring-up.
  MODE_DIAL_IN      = 2;
  // Existing ONNX policy loop drives commands. Disarms all motors when
  // leaving this mode.
  MODE_RUN_POLICY   = 3;
}

// ---------------------------------------------------------------------------
// Per-motor state
// ---------------------------------------------------------------------------

message MotorState {
  string joint_name    = 1;   // matches config YAML `joints[].name`
  string can_interface = 2;   // e.g. "can1"
  uint32 motor_id      = 3;   // Robstride node id (1..255)
  string model         = 4;   // "RS01" .. "RS04"

  // Armed = motor has accepted Enable and the supervisor is sending
  // hold-gain commands. Implies powered and tracking.
  bool   armed             = 5;
  // True if no feedback frame has arrived within feedback_timeout_ms.
  bool   feedback_stale    = 6;
  // Robstride fault byte (bits per the protocol; 0 = healthy).
  uint32 fault_bits        = 7;

  float  position_rad      = 10;
  float  velocity_rad_s    = 11;
  float  torque_nm         = 12;
  float  temperature_c     = 13;

  // True once at least one feedback frame (0x02 or 0x18) has been parsed
  // for this joint. Mirror consumers should gate on this the same way they
  // gate IMU orientation on ``ImuStats.received``.
  bool   position_received = 15;

  // Most recent commanded position target, post-clamp and post-slew. In
  // DialIn mode this is what the supervisor's hold cycle is asking the
  // motor to track. When the motor is disarmed this is meaningless;
  // callers should ignore it unless `armed` is true.
  float  target_position_rad = 14;

  // Hard limits from the YAML config, copied so the UI can render
  // percent-of-limit bars without holding its own config copy.
  float  pos_min_rad   = 20;
  float  pos_max_rad   = 21;
  float  vel_max       = 22;
  float  tau_max       = 23;
  float  temp_max      = 24;
}

// ---------------------------------------------------------------------------
// ODrive wheel state (wheeled differential-drive chassis)
// ---------------------------------------------------------------------------

// One entry per configured wheel. Positions/velocities are already in robot
// frame (the per-wheel `direction` sign applied), so a positive velocity is
// forward for both wheels.
message WheelState {
  string name           = 1;   // matches config YAML `wheels[].name`
  string can_interface  = 2;
  uint32 node_id        = 3;   // ODrive node id (0..63)

  bool   armed             = 5;
  // True if no encoder/heartbeat within `feedback_timeout_ms`.
  bool   feedback_stale    = 6;
  // True once at least one encoder/heartbeat frame has been decoded.
  bool   position_received = 15;
  // Axis error word from the heartbeat (0 = healthy).
  uint32 error_code        = 7;

  // Cumulative wheel angle (rad, unbounded) and angular velocity (rad/s).
  float  position_rad      = 10;
  float  velocity_rad_s    = 11;
  // Most recent commanded velocity (rad/s), post clamp + slew.
  float  target_velocity_rad_s = 14;

  // Hard velocity limit from the YAML config (rad/s).
  float  vel_max           = 22;

  // Raw ODrive AxisState from the heartbeat (0 = UNSPECIFIED, 1 = IDLE,
  // 8 = CLOSED_LOOP_CONTROL; any calibration state in 3..=11). Lets the
  // operator see "armed but axis still IDLE" — the silent-enable-fail
  // mode that hides an uncalibrated encoder.
  uint32 axis_state      = 23;
}

// Differential-drive summary: the operator twist actually in effect plus the
// wheel-encoder odometry pose. `present` is false on the humanoid (no
// `drive:` block).
message DriveState {
  bool  present = 1;

  // Operator twist command (body frame), clamped/slewed by the firmware.
  float cmd_linear_x  = 2;
  float cmd_angular_z = 3;

  // True when the operator-link watchdog zeroed a stale twist (no fresh
  // SetVelocityCommand within the server's `operator_timeout_ms` while a
  // non-zero twist was active). Cleared by the next fresh command; the
  // operator app renders a "link lost — motion halted" pill while set.
  bool  operator_stale = 4;

  // Operator arbitration: at most one WS connection ("active operator")
  // may send non-zero drive commands. The assignment follows input —
  // the first client to send a drive command claims it, keeps it while
  // its commands keep arriving, and loses it on disconnect, operator
  // staleness, E-STOP, or after the server's `operator_grace_ms`
  // passes without input from that client (then anyone's next drive
  // command takes over). Zero-twist stops are always accepted from any
  // client regardless of the assignment.
  //
  // `has_active_operator` reports that a *fresh* assignment exists;
  // `you_are_active_operator` is computed per connection so each client
  // knows whether it holds the assignment (broadcast telemetry frames
  // are built per connection by the server).
  bool  has_active_operator      = 5;
  bool  you_are_active_operator  = 6;

  // Wheel-encoder odometry pose (m, m, rad). Reset via ResetOdometry.
  float odom_x     = 10;
  float odom_y     = 11;
  float odom_theta = 12;
}

// Camera gimbal state (OBSBOT Tiny 2, standard UVC pan/tilt controls).
// `present = false` when the runtime has no `video:` config, or when the
// camera hasn't been heard from since boot. Pose is the *actual* pose
// read back from the camera (never the assumed target — the gimbal
// occasionally applies its own horizon compensation).
message CameraState {
  bool  present  = 1;
  // Actual gimbal pose in degrees (pan + = right, tilt + = up,
  // 0/0 = power-on center). OBSBOT Tiny 2 range: pan ±130°, tilt ±90°.
  float pan_deg  = 2;
  float tilt_deg = 3;
  // True while the actual pose differs from the last commanded target
  // by more than ~1 degree on either axis (gimbal still slewing).
  bool  moving   = 4;
}

// ---------------------------------------------------------------------------
// CAN bus health
// ---------------------------------------------------------------------------

message BusEntry {
  string can_interface = 1;
  // From `ip -details link show <iface>`; e.g. "ERROR-ACTIVE",
  // "ERROR-PASSIVE", "BUS-OFF". Empty if it couldn't be read.
  string state         = 2;
  bool   healthy       = 3;   // true iff state == "ERROR-ACTIVE"
}

// ---------------------------------------------------------------------------
// Power-board telemetry (Robstride PowerBoard)
// ---------------------------------------------------------------------------

// One frame per snapshot/telemetry frame, holding the latest cached
// status from the power board configured under `power:` in the
// firmware's YAML config. `present = false` when no power board is
// configured (older robots or bring-up rigs without a board); the UI
// should hide the power card in that case.
message PowerStats {
  // True iff the firmware was configured with a `power:` block. Other
  // fields are only meaningful when this is set.
  bool   present              = 1;

  // CAN bus and Robstride board address being polled.
  string can_interface        = 2;
  uint32 power_id             = 3;
  // Firmware version reported by the board ("PBV1.00"); empty until the
  // first version response arrives.
  string firmware_version     = 4;

  // Whether the firmware has received at least one Type-03 status
  // response from the board. False at boot until polling succeeds.
  bool   status_received      = 10;
  // True if the most recent successful status response is older than
  // ~3 × poll_interval — usually means the board lost power or the bus
  // dropped frames. Operator UI should show this as a warning.
  bool   status_stale         = 11;
  // Milliseconds since the firmware last decoded a status response.
  // Reads as 0 before the first response arrives; check `status_received`.
  uint32 last_status_age_ms   = 12;

  // Raw battery / VBUS voltage from the board sensor. Volts.
  float  battery_voltage_v    = 20;
  // Voltage on the motor branch downstream of the soft-start FET.
  // During pre-charge / discharge this differs from battery_voltage.
  float  motor_voltage_v      = 21;
  // Internal board temperature, °C.
  float  board_temperature_c  = 22;

  // Decoded fault word (24 bits, low 16 are real faults; bits 20..23
  // are rail on/off indicators). Zero on the low bits = no faults.
  uint32 fault_bits           = 30;
  // Human-readable fault decoding (or "normal" / "" when healthy).
  string fault_description    = 31;
  // Convenience flags decoded from `fault_bits >> 20`.
  bool   rail_12v_on          = 32;
  bool   soft_start_on        = 33;
  bool   motor_rail_on        = 34;
  bool   rail_24v_on          = 35;

  // Per-branch currents from the most recent Type-04 query. Amps.
  // Zero values are reported when no current frame has arrived yet.
  float  current_al_a         = 40;
  float  current_ar_a         = 41;
  float  current_ll_a         = 42;
  float  current_lr_a         = 43;
  // Sum of the four branch currents for convenience. Amps.
  float  total_motor_current_a = 44;

  // Battery pack metadata copied from the firmware config so the UI can
  // render a fuel-gauge bar without holding its own copy.
  uint32 battery_cells        = 50;
  float  pack_full_voltage_v  = 51;  // cell_full × cell_count
  float  pack_empty_voltage_v = 52;  // cell_empty × cell_count
  // Linear-interp state-of-charge in % (0..100). -1 means "unknown"
  // (e.g. battery_voltage hasn't been received yet, or the linear model
  // would extrapolate outside the configured range).
  float  state_of_charge_pct  = 53;
}

// ---------------------------------------------------------------------------
// Streamed telemetry
// ---------------------------------------------------------------------------

message TelemetryFrame {
  uint64 host_unix_ms   = 1;
  Mode   mode           = 2;
  bool   estop_latched  = 3;
  string estop_reason   = 4;
  repeated MotorState motors = 10;
  repeated BusEntry   buses  = 11;
  // Latest power-board telemetry. `power.present = false` on robots
  // without a power board configured. Optional so old clients can still
  // decode the frame (default is `present=false`).
  PowerStats power      = 12;
  // Latest IMU rotation-vector reading. `imu.present = false` on robots
  // built without the optional BNO080/BNO085. Optional so old clients
  // can still decode the frame.
  ImuStats imu          = 13;
  // Latest policy observation/action I/O from the 100 Hz ONNX loop.
  // `policy_io.present = false` when no policy was loaded at boot.
  // Optional so old clients can still decode the frame.
  PolicyIoStats policy_io = 14;
  // ODrive wheel state (empty on the humanoid).
  repeated WheelState wheels = 15;
  // Differential-drive summary; `present=false` without a `drive:` block.
  DriveState drive = 16;
  // Deprecated (plan §9): the OBSBOT camera is removed — the firmware
  // no longer populates this. Kept for wire compatibility with older
  // clients (they render `present=false`).
  CameraState camera = 17 [deprecated = true];
  // Deprecated (plan §9): the legacy navseg runner is removed — the
  // firmware no longer populates this. Kept for wire compatibility.
  NavState nav = 18 [deprecated = true];
}

// One-shot reply to GetSnapshot — same content as TelemetryFrame.
message Snapshot {
  uint64 host_unix_ms   = 1;
  Mode   mode           = 2;
  bool   estop_latched  = 3;
  string estop_reason   = 4;
  repeated MotorState motors = 10;
  repeated BusEntry   buses  = 11;
  PowerStats power      = 12;
  ImuStats imu          = 13;
  PolicyIoStats policy_io = 14;
  repeated WheelState wheels = 15;
  DriveState drive = 16;
  // Deprecated (plan §9): see TelemetryFrame.camera.
  CameraState camera = 17 [deprecated = true];
  // Deprecated (plan §9): see TelemetryFrame.nav.
  NavState nav = 18 [deprecated = true];
}

message BusStatusUpdate {
  repeated BusEntry buses = 1;
}

// ---------------------------------------------------------------------------
// Client requests
// ---------------------------------------------------------------------------

message SubscribeTelemetry {
  // Hint; server clamps to a sane range (default 30 Hz, max 100 Hz).
  uint32 rate_hz = 1;
}

message UnsubscribeTelemetry {}

message GetSnapshot {}

message SetMotorEnabled {
  string joint_name = 1;
  bool   enabled    = 2;
}

message SetAllMotorsEnabled {
  bool enabled = 1;
}

// Drive a twist into the wheeled chassis. `linear_x` (m/s forward) and
// `angular_z` (rad/s yaw, + left) are body-frame; the firmware converts to
// per-wheel velocity via the `drive:` geometry and slews/clamps each tick.
message SetVelocityCommand {
  float linear_x  = 1;
  float angular_z = 2;
}

// Arm/disarm a single ODrive wheel. `wheel_name` matches a `wheels:[]` key
// in the robot YAML; arming sets velocity mode + closed-loop control.
message SetWheelEnabled {
  string wheel_name = 1;
  bool   enabled    = 2;
}

message SetAllWheelsEnabled {
  bool enabled = 1;
}

// Run the ODrive FULL_CALIBRATION_SEQUENCE (motor + encoder offset) on
// one disarmed wheel. The axis spins for ~20-30 s; watch `wheel.axis_state`
// transition IDLE -> CALIBRATION -> IDLE. See the field comment on
// `calibrate_wheel` for the persistence caveat.
message CalibrateWheel {
  string wheel_name = 1;
}

// Command the camera gimbal to an absolute pan/tilt pose in degrees
// (pan + = right, tilt + = up; 0/0 = power-on center). The firmware
// clamps to the camera's UVC-reported limits (OBSBOT Tiny 2: pan ±130°,
// tilt ±90°, 1° step — see the recon notes in `video.rs`) and reads
// back the settled pose in telemetry / snapshot. Motion takes ~0.5-0.7 s
// for a 30° move at default gimbal speed.
message SetCameraPose {
  float pan_deg  = 1;
  float tilt_deg = 2;
}

message ResetOdometry {}

message SetMode {
  Mode mode = 1;
}

// Latches the supervisor into E-STOP and disables every motor. Persists
// until ResetEStop is sent.
message EmergencyStop {
  string reason = 1;
}

message ResetEStop {}

// Set the hold-target for a single armed motor (DialIn mode only). The
// supervisor clamps to the joint's hard_limits and slews from the previous
// target at `slew.max_pos_step_per_tick` per 100 Hz tick, so an instant
// jump from the operator UI is safely converted to a controlled move.
//
// Motor must be armed and the runtime must be in DIAL_IN mode; the call
// is rejected otherwise.
message SetMotorTarget {
  string joint_name   = 1;
  float  position_rad = 2;
}

// Re-zero a single motor's mechanical origin. The supervisor sends the
// Robstride SET_ZERO (0x06) frame, which causes the motor to treat its
// current physical position as the new 0 rad reference and to persist
// that origin to flash. Subsequent telemetry frames will report
// position relative to the new zero.
//
// Preconditions enforced by the firmware:
//   - E-STOP not latched
//   - The joint exists
//   - The joint is currently *disarmed* (we won't reset the origin
//     while a control loop is sending hold commands)
//   - The joint's CAN bus is ERROR-ACTIVE (otherwise the SET_ZERO frame
//     would be silently dropped)
//
// This is a destructive, persistent operation: it overwrites the motor's
// stored origin. Operator UIs should confirm before sending.
message SetMechanicalZero {
  string joint_name = 1;
}

// Re-zero every actuator at once. See `ClientRuntimeMessage.set_mechanical_zero_all`
// for the flow and preconditions. The reply Ack carries a per-joint
// summary: which joints were re-zeroed and which reported a fresh
// position outside the verification tolerance after the write (a motor
// that silently ignored SET_ZERO shows up there instead of failing
// silently — the exact failure mode that makes ad-hoc re-zeroing
// untrustworthy).
message SetMechanicalZeroAll {}

// Toggle the policy dry-run flag. See `ClientRuntimeMessage.set_policy_dry_run`
// for semantics. The firmware acks the request immediately; the new value
// is honored on the next 100 Hz `PolicyRunner` tick.
message SetPolicyDryRun {
  bool enabled = 1;
}

// ---------------------------------------------------------------------------
// Server responses / async events
// ---------------------------------------------------------------------------

message Ack {
  bool   ok      = 1;
  string message = 2;
}

message Error {
  string message = 1;
}

message ModeChanged {
  Mode mode = 1;
}

message EStopLatched {
  string reason = 1;
}

// ---------------------------------------------------------------------------
// IMU telemetry (BNO080/BNO085 rotation vector)
// ---------------------------------------------------------------------------

// Latest fused orientation reading from the optional BNO080/BNO085 IMU.
// `present = false` when the firmware was built/configured without an
// `imu:` block in the YAML (the UI should hide the orientation card in
// that case). `received = false` after first boot until the sensor
// produces a usable quaternion. Quaternion convention matches
// `bno080::wrapper::BNO080::rotation_quaternion`: `[qx, qy, qz, qw]`
// with `qw` last (Hamilton, XYZW order); identity is `(0, 0, 0, 1)`.
//
// Lives at the bottom of the file (rather than next to `PowerStats`)
// so adding it doesn't shift the descriptor indices of every following
// message, which would force a churn-y diff in the buf-es generated
// TypeScript bindings.
message ImuStats {
  // True iff `imu:` is configured in the firmware YAML.
  bool   present                = 1;
  // True after the first rotation-vector frame has been decoded.
  bool   received               = 10;
  // True if no fresh rotation-vector frame has arrived in ~3× the
  // sensor's report period. Operator UI should grey out the widget.
  bool   stale                  = 11;
  // Milliseconds since the last successful quaternion read. 0 before
  // the first frame; check `received`.
  uint32 last_update_age_ms     = 12;

  // Body-frame orientation as a unit quaternion (Hamilton, XYZW).
  //
  // Frame contract: the firmware applies any `imu.mount:` rotation
  // declared in the joint YAML *before* publishing, so this is already
  // in body frame (REP-103 / FLU: +x forward, +y left, +z up). UIs and
  // the future PolicyRunner IMU feed can render / consume it as a
  // calibrated body-frame attitude with no further rotation. Matches
  // `bebop_linux::observation::ImuState::quaternion`.
  //
  // Normalization contract: while `received = true`, the producer
  // guarantees |q| = 1 within float precision. Before the first frame
  // (received = false) the components are all zero — consumers must
  // gate on `received` rather than e.g. computing Euler angles
  // directly from raw fields.
  float  quaternion_x           = 20;
  float  quaternion_y           = 21;
  float  quaternion_z           = 22;
  float  quaternion_w           = 23;
  // BNO08x-reported heading-accuracy estimate (radians, 1σ). 0 until
  // the sensor has converged.
  float  heading_accuracy_rad   = 24;
}

// ---------------------------------------------------------------------------
// Policy I/O telemetry (ONNX observation + action vectors)
// ---------------------------------------------------------------------------

// Latest observation/action snapshot from [`PolicyRunner`]. Published at
// the telemetry rate (~30 Hz) but sourced from the 100 Hz inference loop
// (always the most recent tick). `present = false` when the firmware
// failed to load `policy.onnx` at boot; `active = false` outside
// `MODE_RUN_POLICY` or while E-STOP is latched.
//
// Vector layouts mirror `bebop_linux::observation::ObservationBuilder` and
// the rate-limited `policy I/O` log line:
//
//   observation[ 0.. 3)  base_ang_vel
//   observation[ 3.. 6)  projected_gravity
//   observation[ 6..14)  joint_pos_rel
//   observation[14..22)  joint_vel
//   observation[22..46)  last_action (24-dim raw NN output)
//   observation[46..49)  cmd_vel (vx, vy, wz)
//
// (No base_lin_vel channel — the robot cannot observe its base linear
//  velocity, so it was dropped from the observation and training.)
//
//   raw_action[ 0.. 8)  position commands (pre-decode, [-1, 1])
//   raw_action[ 8..16)  kp commands
//   raw_action[16..24)  kd commands
//
// Joint-ordered slices use the policy slot order documented in
// `bebop_linux::observation::JOINT_NAMES`.
message PolicyIoStats {
  // True iff `policy.onnx` loaded successfully at boot.
  bool   present                = 1;
  // True while the 100 Hz loop is actively inferring (RunPolicy + !E-STOP).
  bool   active                 = 2;
  // Whether the observation builder is consuming live BNO085 readings
  // (`true`) or the synthetic upright fallback (`false`). Driven by the
  // rotation-vector freshness clock; if this is true the gyro / `base_ang_vel`
  // channel is treated as live too.
  bool   imu_live               = 3;
  // Tag 4 was the historical `gyro_live` flag that surfaced a separate
  // freshness clock for the BNO085 calibrated-gyro (0x02) subscription.
  // Removed once the SPI / Teensy bridge bring-up was stable enough that
  // a fresh rotation vector implies a fresh gyro in every observed
  // failure mode; reserved so we don't accidentally re-use the field.
  reserved 4;
  reserved "gyro_live";
  // True when the operator has enabled policy "dry run" (`SetPolicyDryRun`).
  // In this state RUN_POLICY still infers, publishes telemetry, and writes
  // capture rows, but the per-tick `safe_send_ctrl` motor command is
  // skipped — armed motors receive no PD command from the policy.
  bool   dry_run                = 5;
  // True while an MCAP capture file is currently open and being
  // appended to on the robot. Capture is always-on whenever the
  // runtime is in DIAL_IN or RUN_POLICY (and not E-STOPped); this
  // flag will flip to `false` in IDLE / under E-STOP. The writer
  // auto-rotates the file on size, so this stays `true` across
  // rotations — only `capture_path` / `capture_rows` change.
  bool   capture_active         = 6;
  // Absolute filesystem path of the currently-open capture segment on
  // the robot, or empty when no capture is open. Changes whenever the
  // writer rotates to a new segment. Files are available via the
  // runtime HTTP server at `/captures` (list) and `/captures/dl/<name>`
  // (download). `.mcap` extension.
  string capture_path           = 7;
  // Number of samples appended to the *current* capture segment.
  // Resets to 0 each time the writer rotates to a new file; the
  // total across segments is not tracked here.
  uint64 capture_rows           = 8;
  // Cumulative samples the tick thread tried to enqueue but the writer
  // thread's bounded channel was full for. Monotonic across the process
  // lifetime. `0` means the writer is keeping up; sustained growth means
  // the disk / compression can't drain at 100 Hz and the capture has
  // gaps. UIs should flag non-zero values.
  uint64 capture_dropped        = 9;

  // Full 49-element observation fed to ONNX on the most recent tick.
  repeated float observation    = 10;
  // Full 24-element raw NN output from the most recent tick.
  repeated float raw_action     = 11;

  // Decoded MIT-mode commands (8 joints, policy slot order).
  repeated float position_targets_rad = 20;
  repeated float kp             = 21;
  repeated float kd             = 22;

  // Policy slot joint names (same order as the 8-element slices above).
  repeated string joint_names   = 30;
}

// ---------------------------------------------------------------------------
// Navigable-path inference (nav runner)
// ---------------------------------------------------------------------------
//
// The nav runner is the firmware-side consumer of the SegFormer
// navigable-path student model (`navseg.onnx`, exported from
// `bebop-vision`). It subscribes to the camera hub's MJPEG broadcast,
// decodes + preprocesses each frame, runs ONNX inference (CUDA EP when
// the loaded libonnxruntime supports it, CPU otherwise), and publishes:
//
//   - `NavState` — a summary embedded in every telemetry/snapshot frame
//     (mask rate, class fractions) so dashboards can show "nav: 12 Hz,
//     51% navigable" without subscribing to the grid.
//   - `NavMaskFrame` — the low-res label grid itself, pushed at the
//     subscribed rate so the operator app can overlay navigable /
//     caution regions on the live video playback. Subscribe-gated.
//
// Label semantics (matching `bebop_vision.labelnav` / the training data):
//   0 = blocked, 1 = navigable, 2 = caution.

// Subscribe to pushed `NavMaskFrame`s. Nothing is pushed until this is
// sent; `UnsubscribeNav` stops the stream. Mirrors the telemetry
// subscription pattern.
message SubscribeNav {
  // Rate hint in Hz. The server clamps to the nav runner's own rate —
  // asking for more than the model produces just re-sends the newest
  // grid, so this is an upper bound on overlay update frequency.
  uint32 rate_hz = 1;
}

message UnsubscribeNav {}

// Navigable-path inference summary, embedded in telemetry + snapshots.
message NavState {
  // True iff `navseg.onnx` loaded and the runner thread is up.
  bool  present        = 1;
  // True once the first mask has been produced.
  bool  received       = 2;
  // Measured inference rate (EMA over the runner loop), Hz.
  float mask_hz        = 3;
  // Which execution provider is serving the model ("cuda" / "cpu").
  string provider      = 4;
  // Camera frame sequence number the latest mask was computed from.
  uint64 seq           = 10;
  // Camera capture timestamp of that frame (µs since epoch — matches the
  // `X-Timestamp-Us` part header on `GET /video`, so consumers can align
  // masks with frames).
  uint64 ts_us         = 11;
  // Fractions of the (128×128 argmax) label map per class, 0..1.
  float frac_blocked   = 20;
  float frac_navigable = 21;
  float frac_caution   = 22;
}

// One pushed navigable-path label grid, for the live video overlay.
// The grid covers the whole camera frame (the model is fed a square
// 512×512 resize of the full frame, so the grid maps 1:1 onto the
// frame's aspect regardless of its resolution).
message NavMaskFrame {
  // Camera frame sequence number this mask was computed from.
  uint64 seq = 1;
  // Camera capture timestamp (µs since epoch; matches `NavState.ts_us`).
  uint64 ts_us = 2;
  // Grid dimensions: `grid.len() == width * height`. 160×90 (16:9).
  uint32 width  = 3;
  uint32 height = 4;
  // Row-major label map, one byte per cell: 0 = blocked, 1 = navigable,
  // 2 = caution. Cell (x, y) covers the frame rectangle
  // [x/width, (x+1)/width) × [y/height, (y+1)/height) of the frame.
  bytes  grid = 5;
  // Summary stats (same values as `NavState`) so overlay consumers get
  // everything in one message without a separate telemetry join.
  float frac_blocked   = 10;
  float frac_navigable = 11;
  float frac_caution   = 12;
  float mask_hz        = 13;
  string provider      = 14;
}
