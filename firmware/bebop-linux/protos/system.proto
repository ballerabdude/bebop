// Always-on system telemetry, written to `system_*.mcap` by
// `src/system_capture.rs`.
//
// Protobuf (not ROS2/CDR) because the Rerun MCAP decoder builds its
// descriptors from the embedded FileDescriptorSet and maps each message to
// a `<full_name>:message` component, exactly like the navd recorder's
// `bebop.navd.*` structs. The dashboard's SeriesLines then select fields
// (e.g. `bebop.system.Power:message` -> `.battery_voltage_v`).
//
// Field numbers are stable: a logged field must never be renumbered or
// reused, or old captures decode wrong.
syntax = "proto3";

package bebop.system;

// Power-board snapshot (raw branch currents / fault word included).
message Power {
  // Host epoch nanoseconds; also carried in the MCAP message log_time.
  int64 stamp_ns = 1;
  bool present = 2;
  bool status_received = 3;
  bool status_stale = 4;
  string can_interface = 5;
  string firmware_version = 6;
  float battery_voltage_v = 7;
  float motor_voltage_v = 8;
  float board_temperature_c = 9;
  uint32 fault_bits = 10;
  string fault_description = 11;
  float current_al_a = 12;
  float current_ar_a = 13;
  float current_ll_a = 14;
  float current_lr_a = 15;
  float total_motor_current_a = 16;
  uint32 battery_cells = 17;
  float pack_full_voltage_v = 18;
  float pack_empty_voltage_v = 19;
  float state_of_charge_pct = 20;
}

// One thermal-zone reading (`/sys/class/thermal`).
message ThermalZone {
  string name = 1;
  float temp_c = 2;
}

// Host utilization + thermals.
message Host {
  int64 stamp_ns = 1;
  float cpu_pct = 2;
  float gpu_pct = 3;
  bool gpu_present = 4;
  float ram_used_pct = 5;
  uint64 ram_used_bytes = 6;
  uint64 ram_total_bytes = 7;
  float disk_used_pct = 8;
  float load1 = 9;
  float load5 = 10;
  float load15 = 11;
  repeated ThermalZone thermal = 12;
}

// Drive-session start/stop marker. `session` is a `%Y%m%d_%H%M%S` stamp
// matching the navd session filename convention, so a `navd_session_*.mcap`
// can be joined to the system timeline.
message SessionMarker {
  int64 stamp_ns = 1;
  string event = 2;
  string mode = 3;
  string session = 4;
}
