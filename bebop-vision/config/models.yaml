# Bebop model catalog.
#
# The robot does NOT ship model weights. This file is the single source of
# truth for what can be provisioned, shared by the firmware (which serves it
# to the app and reports status) and the Python downloader
# (`python -m bebop_vision.download_model <id>`).
#
# `kind`:
#   hf    - fetch from Hugging Face. `gated: true` entries need an HF token
#           (set from the app); the token's account must have accepted the
#           model's license. Files land in `bebop-vision/weights/`.
#   local - trained/produced on the robot or copied from a workstation
#           (e.g. `scp`). Presence is reported in the app; there is nothing
#           to download.
#
# `download` (kind="hf" only):
#   files    - fetch just the named `files` (default). Presence is the files.
#   snapshot - fetch the whole repo with `snapshot_download` into
#              `weights/<dest or id>/`. Used for checkpoints a runtime builds
#              from (config + tokenizer + chat template + safetensors shards),
#              e.g. TensorRT Edge-LLM voice models. A `.bebop-complete` marker
#              is written on success; presence is that marker.
#
# Add a model by appending an entry — no code changes.

models:
  # --- Hugging Face (gated) -------------------------------------------------
  - id: sam3.1
    name: SAM 3.1
    description: Open-vocabulary, text-prompted instance segmentation.
    kind: hf
    purpose: segmentation
    repo: facebook/sam3.1
    files: [sam3.1_multiplex.pt]
    revision: main
    gated: true
    bytes: 3502755717

  - id: sam3
    name: SAM 3
    description: Previous-generation open-vocabulary segmentation.
    kind: hf
    purpose: segmentation
    repo: facebook/sam3
    files: [sam3.pt]
    revision: main
    gated: true

  # DINOv3 backbones pair with SAM 3.1 for a stronger open-vocab stack.
  - id: dinov3-vitl16
    name: DINOv3 ViT-L/16
    description: Self-supervised vision backbone (SAM 3.1 feature extractor).
    kind: hf
    purpose: backbone
    repo: facebook/dinov3-vitl16-pretrain-lvd1689m
    files: [model.safetensors]
    revision: main
    gated: true

  # --- Local / on-robot trained --------------------------------------------
  - id: navd
    name: navd (BEV student)
    description: Locally trained bird's-eye-view navigation model (ONNX).
    kind: local
    purpose: navigation
    path: navd.onnx

  - id: navd_traj
    name: navd-traj
    description: Locally trained end-to-end trajectory model (ONNX).
    kind: local
    purpose: navigation
    path: navd_traj.onnx

  # --- Voice / speech-to-speech (TensorRT Edge-LLM) ------------------------
  # Full-repo snapshot: the Edge-LLM checkpoint-direct builder needs the whole
  # repo (config, tokenizer, chat template, safetensors shards), not a file
  # list. The voice service serves this checkpoint on :9093 (see docs/voice.md).
  - id: qwen3-omni-30b
    name: Qwen3-Omni 30B-A3B
    description: End-to-end speech-to-speech (audio in, natural speech out).
    kind: hf
    purpose: voice
    repo: Qwen/Qwen3-Omni-30B-A3B-Instruct
    download: snapshot
    dest: qwen3-omni-30b
    revision: main
    gated: false
    bytes: 63000000000

  # --- Voice cascade (speech-to-speech, best model per stage) ---------------
  # Multi-hop: ASR (audio -> text) -> VLM brain (text+image -> text, native
  # tool calling) -> TTS (text -> speech). Each stage is its own Edge-LLM
  # server (see docs/voice.md). Same `snapshot` provisioning as above.
  - id: qwen3-asr-1.7b
    name: Qwen3-ASR 1.7B
    description: Speech recognition (audio -> text) for the voice cascade.
    kind: hf
    purpose: asr
    repo: Qwen/Qwen3-ASR-1.7B
    download: snapshot
    dest: qwen3-asr-1.7b
    revision: main
    gated: false
    bytes: 4000000000

  - id: qwen3-tts-1.7b
    name: Qwen3-TTS 1.7B (CustomVoice)
    description: Natural speech synthesis (text -> speech) for the cascade.
    kind: hf
    purpose: tts
    repo: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    download: snapshot
    dest: qwen3-tts-1.7b
    revision: main
    gated: false
    bytes: 4000000000

  # Brain: latest Qwen3.8 27B (multimodal, 256k context), pre-quantized NVFP4
  # so the Edge-LLM builder needs no separate quantize pass.
  - id: qwen3.8-27b-nvfp4
    name: Qwen3.8 27B (NVFP4)
    description: Multimodal reasoning brain for the voice cascade (text+image).
    kind: hf
    purpose: brain
    repo: RadixArk/Qwen3.8-27B-NVFP4
    download: snapshot
    dest: qwen3.8-27b-nvfp4
    revision: main
    gated: false
    bytes: 18000000000
