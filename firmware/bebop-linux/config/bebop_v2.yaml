# ============================================================================
# Bebop V2 (humanoid) joint configuration.
#
# Loaded by `bebop-linux` at startup via `RobotConfig::from_yaml(path)`.
# Schema deliberately matches `ros2/src/bebop_pilot/config/safety_limits.yaml`
# so the same file can later become the single source of truth for both
# the Rust runtime and any ROS2 bridge nodes.
#
# All limits below are *our* safety envelope, not the manufacturer's max.
# Procedure for raising any one of them:
#   1.  Verify the joint can mechanically reach it (manual back-drive).
#   2.  In the dial-in tool, run the relevant test (e.g. vel_probe) at the
#       *current* limit and confirm the motor tracks without faulting.
#   3.  Edit a single field here, raising it by no more than ~25%, re-run.
#   4.  Repeat until you hit a real mechanical / thermal / current ceiling.
# Do not raise multiple limits at once — you lose the ability to attribute
# a fault to the change.
# ============================================================================

defaults:
  hard_limits:
    pos_min: -0.5             # rad — well inside the ±4π motor encoder range
    pos_max:  0.5
    vel_max:  2.0             # rad/s (~115 °/s)
    tau_max:  8.0             # Nm
    temp_max: 65.0            # °C — keep well below firmware overtemp (~85 °C)
    feedback_timeout_ms: 100  # E-STOP if no RX feedback within this window

  # Always-active gains while a motor is "armed" but no test is driving it.
  # Stiffness low; damping > 0 so the motor never goes limp under power.
  hold_gains: { kp: 5.0, kd: 1.0 }

  # Default gains for active tests (currently unused; phase 2).
  test_gains: { kp: 30.0, kd: 2.0 }

  # Setpoint slew limits applied to the *position channel* of the
  # variable-impedance MIT-mode policy output. MUST match
  # `max_pos_step_per_tick` on the sim ActionsCfg in
  # `sim/bebop_training/experiments/exp_standing.py` (currently 0.020).
  # 0.020 rad/tick @ 100 Hz tick = 2 rad/s setpoint slew — the
  # mechanical safety envelope agreed with the operator. Gain
  # channels (kp/kd) are NOT slew-clamped — variable impedance demands
  # instantaneous between-tick gain changes. If you retune this value,
  # retrain.
  slew:
    max_pos_step_per_tick: 0.020   # rad/tick — must match sim exp_standing.py max_pos_step_per_tick
    arm_ramp_s:            0.5     # gain ramp 0 → hold over arm
    abort_ramp_s:          0.3     # gain ramp hold → 0 over abort

  # Per-joint policy-emitted kp/kd clamps. The 24-dim MIT-mode action
  # vector carries (8 positions, 8 kp, 8 kd) per tick; the loader
  # affine-maps each raw kp / kd channel from [-1, 1] into the
  # `(kp_min, kp_max)` / `(kd_min, kd_max)` range for its joint. These
  # MUST mirror `POLICY_KP_MIN/MAX` and `POLICY_KD_MIN/MAX` in
  # `sim/bebop_training/envs/bebop_v2_base_cfg.py` — the trained policy
  # baked in this gain envelope. Per-joint overrides (below in the
  # `joints:` block) win over the defaults here.
  #
  # Conservative defaults (overridden per joint group). The loader
  # additionally rejects any clamp that exceeds the motor model's
  # encoder ceiling (`RobstrideSpecs::RSxx.{kp_max, kd_max}` in
  # `firmware/bebop-linux/src/config.rs`).
  # Defaults are the hip_flexion (RS04) values; the four motor groups
  # have per-joint overrides below.
  # Jun 2026 sim-to-real NARROWING (mirror of POLICY_KP/KD_* in
  # exp_standing.py): kp ceilings lowered + bands tightened + kd floors lifted
  # to cut loop gain and per-tick gain-noise so the stand stops ringing on
  # hardware. If you retune one side, retune BOTH and retrain.
  policy_gain_clamps:
    kp_min: 20.0
    kp_max: 120.0
    kd_min: 2.0
    kd_max: 5.0

# ============================================================================
# Joints. Index order matters for the ONNX policy: it MUST match
#   bebop_training/envs/bebop_v2_base_cfg.py:JOINT_NAMES_ALL
# Bebop V2 numbering convention: tens digit = side (3 = left, 4 = right),
# ones digit = joint level. Left leg lives on can0, right leg on can1.
# ============================================================================
joints:
  # `hold_gains` are the per-joint armed-but-idle gains (used in DialIn,
  # during the arm/abort ramps, and any time the robot is armed without
  # RunPolicy active). Once RunPolicy is engaged the policy supplies
  # kp/kd on every tick from its MIT-mode action and these are not used
  # for control — they only define the soft "armed" pose.
  #
  # `hard_limits.vel_max` / `hard_limits.tau_max` are the supervisor's
  # E-STOP envelope. They MUST equal the matching `FW_*_VEL_MAX` /
  # `FW_*_TAU_MAX` constants in `sim/bebop_training/envs/bebop_v2_base_cfg.py`
  # so the trained policy sees the same torque / velocity ceiling at
  # deploy time as during training.
  #
  # `policy_gain_clamps` (per-joint, optional — inherits the
  # `defaults.policy_gain_clamps` block when omitted) bounds the
  # decoded kp / kd emitted by the policy. MUST mirror `POLICY_KP_MIN/MAX`
  # and `POLICY_KD_MIN/MAX` in the sim config.

  # ----- Hip flexion (RS04) -------------------------------------------------
  # Top joint off base_link, Y-axis pitch. Renamed from
  # hip_abduction_*_joint to match the URDF anatomical rename — same
  # physical motors (CAN IDs 31 / 41), same RS04 envelope.
  hip_flexion_left_joint:
    can_interface: can0
    motor_id: 31
    model: RS04
    hard_limits: { pos_min: -1, pos_max: 1, vel_max: 12.0, tau_max: 84.0, temp_max: 70.0 }
    hold_gains:  { kp: 40.0,  kd: 3.0 }
    # v0.15: kp_min raised 5 -> 20, kd_min 0.5 -> 1.5 (basal stance stiffness)
    # Jun 2026 sim2real: kp_max 100 -> 80, kd_min 1.5 -> 2.0 (lower gain, more damping)
    # Jun 14: kp_max 80 -> 120 — narrowing starved hip-flexion (pegged at ceiling,
    # torso toppling); rate penalties now handle oscillation. Mirror exp_standing.py.
    policy_gain_clamps: { kp_min: 20.0, kp_max: 120.0, kd_min: 2.0, kd_max: 5.0 }

  hip_flexion_right_joint:
    can_interface: can1
    motor_id: 41
    model: RS04
    hard_limits: { pos_min: -1, pos_max: 1, vel_max: 12.0, tau_max: 84.0, temp_max: 70.0 }
    hold_gains:  { kp: 40.0,  kd: 3.0 }
    # Jun 2026 sim2real: kp_max 100 -> 80, kd_min 1.5 -> 2.0 (mirror hip_flexion_left)
    # Jun 14: kp_max 80 -> 120 (mirror hip_flexion_left)
    policy_gain_clamps: { kp_min: 20.0, kp_max: 120.0, kd_min: 2.0, kd_max: 5.0 }

  # ----- Hip abduction (RS03) -----------------------------------------------
  # X-axis roll, between the hip_flexion and knee_flexion links.
  # Renamed from femur_*_joint (motor IDs 32 / 42 unchanged).
  hip_abduction_left_joint:
    can_interface: can0
    motor_id: 32
    model: RS03
    hard_limits: { pos_min: -1, pos_max: 1, vel_max: 12.0, tau_max: 42.0, temp_max: 70.0 }
    hold_gains:  { kp: 160.0, kd: 6.0 }
    # v0.15: kp_min raised 20 -> 40, kd_min 1.0 -> 2.0
    # Jun 2026 sim2real: kp_max 300 -> 150, kd_min 2.0 -> 3.0 (cut wide gain band)
    policy_gain_clamps: { kp_min: 40.0, kp_max: 150.0, kd_min: 3.0, kd_max: 8.0 }

  hip_abduction_right_joint:
    can_interface: can1
    motor_id: 42
    model: RS03
    hard_limits: { pos_min: -1, pos_max: 1, vel_max: 12.0, tau_max: 42.0, temp_max: 70.0 }
    hold_gains:  { kp: 160.0, kd: 6.0 }
    # Jun 2026 sim2real: kp_max 300 -> 150, kd_min 2.0 -> 3.0 (mirror hip_abduction_left)
    policy_gain_clamps: { kp_min: 40.0, kp_max: 150.0, kd_min: 3.0, kd_max: 8.0 }

  # ----- Knee flexion (RS04) ------------------------------------------------
  # Knee pitch. Renamed from shin_*_joint (motor IDs 34 / 44 unchanged).
  knee_flexion_left_joint:
    can_interface: can0
    motor_id: 34
    model: RS04
    hard_limits: { pos_min: -1.570796, pos_max: 1.570796, vel_max: 12.0, tau_max: 84.0, temp_max: 70.0 }
    hold_gains:  { kp: 120.0, kd: 4.0 }
    # v0.15: kp_min raised 10 -> 30, kd_min 1.0 -> 2.0
    # Jun 2026 sim2real: kp_max 250 -> 150, kd_min 2.0 -> 3.0 (cut wide gain band)
    policy_gain_clamps: { kp_min: 30.0, kp_max: 150.0, kd_min: 3.0, kd_max: 8.0 }

  knee_flexion_right_joint:
    can_interface: can1
    motor_id: 44
    model: RS04
    hard_limits: { pos_min: -1.570796, pos_max: 1.570796, vel_max: 12.0, tau_max: 84.0, temp_max: 70.0 }
    hold_gains:  { kp: 120.0, kd: 4.0 }
    # Jun 2026 sim2real: kp_max 250 -> 150, kd_min 2.0 -> 3.0 (mirror knee_flexion_left)
    policy_gain_clamps: { kp_min: 30.0, kp_max: 150.0, kd_min: 3.0, kd_max: 8.0 }

  # ----- Foot / ankle (RS02) ------------------------------------------------
  foot_left_joint:
    can_interface: can0
    motor_id: 35
    model: RS02
    # RS02 datasheet: rated 6 Nm @ 100 rpm, peak 17 Nm (stall, T-N curve at 36 V).
    hard_limits: { pos_min: -0.8, pos_max: 0.8, vel_max: 20.0, tau_max: 17.0, temp_max: 65.0 }
    hold_gains:  { kp: 375.0, kd: 5.0 }
    # v0.15: kp_min raised 5 -> 20, kd_min 0.2 -> 0.8 — was the joint the
    # v0.14 trained policy left fully soft on deployment (operator could
    # move the foot by hand while the robot was suspended).
    # Standing reset (May 2026): foot clamps widened to restore enough
    # ankle stiffness authority for torso-over-feet balance on hardware.
    # Jun 2026: kp_min 30 -> 80, kd_min 1.0 -> 3.0. The ckpt-11500 stand
    # balanced but buzzed near the setpoint (under-damped) and felt soft;
    # the gains parked at the band midpoint (kp~140, kd~3.0) because nothing
    # rewards stiffness, so the floor was lifted to force a firmer, better-
    # damped ankle. kd_max stays 5.0 (RS02 encoder ceiling). MUST mirror
    # POLICY_KP_MIN/POLICY_KD_MIN[6,7] in sim exp_standing.py.
    # Jun 2026 sim2real: kp_max 250 -> 180 (lower loop gain, anti-ring).
    # Jun 14 ANKLE RESTORE: kp_max 180 -> 250, kp_min 80 -> 100. The 180 cap
    # starved the ankle (pegged at ceiling, robot couldn't hold the torso up);
    # rate penalties now handle oscillation. Hard 17 N·m torque limit unchanged.
    policy_gain_clamps: { kp_min: 100.0, kp_max: 250.0, kd_min: 3.0, kd_max: 5.0 }

  foot_right_joint:
    can_interface: can1
    motor_id: 45
    model: RS02
    hard_limits: { pos_min: -0.8, pos_max: 0.8, vel_max: 20.0, tau_max: 17.0, temp_max: 65.0 }
    hold_gains:  { kp: 375.0, kd: 5.0 }
    # Jun 2026: kp_min 30 -> 80, kd_min 1.0 -> 3.0 (mirror of foot_left_joint
    # and POLICY_KP_MIN/POLICY_KD_MIN[6,7] in sim exp_standing.py).
    # Jun 2026 sim2real: kp_max 250 -> 180 (mirror foot_left_joint).
    # Jun 14 ANKLE RESTORE: kp_max 180 -> 250, kp_min 80 -> 100 (mirror foot_left_joint).
    policy_gain_clamps: { kp_min: 100.0, kp_max: 250.0, kd_min: 3.0, kd_max: 5.0 }

# ============================================================================
# IMU (Adafruit BNO085 breakout on SPI) — optional
# ----------------------------------------------------------------------------
# When this block is present, the runtime opens `spi_device`, pulses the
# BNO into a clean SPI session via `rst_*`, subscribes to SH-2 report
# 0x28 (AR/VR-Stabilized Rotation Vector — the EMI-hardened replacement
# for the magnetometer-locking 0x05), and republishes the latest fused
# quaternion through `Snapshot.imu` / `TelemetryFrame.imu` so the
# operator app can render a live orientation indicator. RunPolicy still
# uses synthetic IMU until live readings are wired into `PolicyRunner`.
#
# # Bebop V2 wiring (the configuration below assumes this wiring)
#
# The Adafruit BNO085 breakout is mounted on the back of the torso PCB.
# The breakout's silkscreen labels change meaning when the board is set
# to **SPI mode** (PS0 = PS1 = 3V3); this is the table that matters:
#
#     ┌─────────────────┬──────────────────────────┬─────────────────────────────┐
#     │ Adafruit label  │ SPI-mode function        │ Jetson Orin Nano header pin │
#     ├─────────────────┼──────────────────────────┼─────────────────────────────┤
#     │ VIN             │ 3–5 V supply (regulated) │ pin 1 or 17 (3V3)           │
#     │ GND             │ ground                   │ any GND                     │
#     │ SCL             │ SCK (clock, input)       │ pin 23 (SPI0_SCK)           │
#     │ SDA             │ MISO (data out of BNO)   │ pin 21 (SPI0_MISO)          │
#     │ DI              │ MOSI (data into BNO)     │ pin 19 (SPI0_MOSI)          │
#     │ CS              │ chip select              │ pin 24 (SPI0_CS0)           │
#     │ INT (HINTN)     │ interrupt to host (LOW)  │ pin 7  (PAC.06)             │
#     │ RST             │ reset (active LOW)       │ pin 15 (PN.01 / GPIO12)     │
#     │ P0              │ mode select bit 0 = HIGH │ tied to 3V3                 │
#     │ P1              │ mode select bit 1 = HIGH │ tied to 3V3                 │
#     └─────────────────┴──────────────────────────┴─────────────────────────────┘
#
# `SDA` / `DI` are deliberately *swapped at the BNO side* relative to
# what the silkscreen looks like — the breakout reuses the I²C labels
# for SPI pins (`SDA` = MISO, `DI` = MOSI). Get this swap wrong and the
# `imu-probe` binary fails stage 2 with `InvalidChipId(0)` even though
# all the wires read continuous. Don't ask how we know.
#
# # GPIO line numbers (Jetson Orin Nano dev kit)
#
# Header pins on Orin Nano map to `gpiochip0` lines as follows — these
# are what `int_chip:` / `int_line:` and `rst_chip:` / `rst_line:`
# below refer to. Cross-check with `sudo gpioinfo gpiochip0`.
#
#     pin 7  → gpiochip0 line 144 (PAC.06)   ← INT (HINTN) on this robot
#     pin 15 → gpiochip0 line 85  (PN.01)    ← RST on this robot
#
# Note: pins 11, 12, 13, 15, 16, 18, 22, 26, 29, 32, 33, 35, 36, 37,
# 38, 40 are also `gpiochip0` lines (mapping in `bebop-linux/src/config.rs`
# and in `imu_probe.rs` docs). The AON chip (`gpiochip1`, `tegra234-gpio-aon`)
# is NOT broken out to the 40-pin header — do not pick a line from there.
#
# # `mount:` block
#
# Describes how the chip is physically glued to the chassis. For each
# sensor axis, say which **body** axis it points along when the robot
# is upright at rest. Body frame is REP-103 / FLU: `+x = forward`,
# `+y = left`, `+z = up`. Accepted values are `+x`, `-x`, `+y`, `-y`,
# `+z`, `-z`; the config loader rejects any combination whose 3×3 matrix
# is not a proper right-handed rotation (det ≠ +1), e.g. duplicate axes
# or accidental reflections.
#
# The runtime post-multiplies every raw BNO reading by this constant
# rotation, so every downstream consumer (telemetry widget, future policy
# observation builder, ROS bridge) sees `q_world_body` — a single,
# body-frame orientation independent of mounting.
#
# # Defaults (when a key is omitted)
#
#   spi_device:                "/dev/spidev0.0"
#   int_chip:                  "gpiochip0"
#   int_line:                  (required — no sensible default)
#   rst_chip:                  "gpiochip0"
#   rst_line:                  (required — no sensible default)
#   rotation_vector_period_ms: 50      # 20 Hz report cadence hint
#   spi_max_speed_hz:          1000000 # 1 MHz SPI clock (BNO085 max 3 MHz)
#   mount:                     identity (sensor frame == body frame)
# ============================================================================

imu:
  # IMU backend: "spi" (default) reads the BNO085 directly over the
  # Jetson's SPI bus using the GPIOs below. "serial" instead consumes
  # pre-fused frames streamed by the Teensy `imu_bridge` firmware over
  # USB serial — in that case the BNO is wired to the Teensy, the
  # spi_device / int_line / rst_line fields are ignored, and you set
  # `serial_device` to the Teensy's primary ACM port. The `mount:` block
  # below applies identically to both backends.
  source: "serial"
  serial_device: "/dev/bebop-imu" # only used when source: "serial".
  #                                 # /dev/bebop-imu is the stable symlink
  #                                 # created by `install-jetson.sh
  #                                 # --setup-imu` (udev, matches the Teensy
  #                                 # 16c0:048b interface 0). Falls back to a
  #                                 # raw "/dev/ttyACM0" if you skip that.

  # SPI controller + INT/RST GPIOs for the Bebop V2 wiring above. These
  # values were validated on-bench with `cargo run --bin imu-probe`
  # streaming a clean 20 Hz quaternion at `|q| = 1.0` over 10 s. If you
  # rewire on a different robot, update both this block AND the wiring
  # comment at the top of this section, then re-run `imu-probe` to
  # confirm before launching the main binary.
  spi_device: "/dev/spidev0.0"
  int_chip:   "gpiochip0"
  int_line:   144                       # header pin 7  (PAC.06)
  rst_chip:   "gpiochip0"
  rst_line:   85                        # header pin 15 (PN.01 / GPIO12)
  # 5 ms = 200 Hz sensor-report cadence (was 50 ms / 20 Hz). The BNO085
  # gyro supports up to 1 kHz; 200 Hz gives the policy fresh rate feedback
  # at low latency. NOTE: this REQUIRES the higher spi_max_speed_hz below —
  # the driver's historical 80 kHz clock cannot carry 200 Hz of RV + gyro.
  rotation_vector_period_ms: 5
  # SPI bus clock for the BNO085. The chip is rated to 3 MHz; 1 MHz is a
  # safe default with ~12× headroom over the old 80 kHz and comfortably
  # sustains 200 Hz. If long / unshielded jumpers make reads flaky at
  # speed (InvalidChipId / garbled headers), step this down (e.g. 500000).
  spi_max_speed_hz: 1000000

  # Bebop V2 PCB orientation (new board): BNO chip sits flat on the back of
  # the torso with its silkscreen +X arrow pointing toward the *front* of
  # the chest, +Z out the *back* of the PCB (= up, away from the spine).
  # By right-handedness that puts +Y toward the robot's *left*, so the
  # sensor frame is aligned with the FLU body frame and the mount is
  # identity (no rotation applied). If +Z actually points *into* the spine
  # (chip flipped), use sensor_y: "-y" instead and re-verify.
  mount:
    sensor_x: "+x"   # sensor +X → body +X  (forward)
    sensor_y: "+y"   # sensor +Y → body +Y  (left)
    sensor_z: "+z"   # sensor +Z → body +Z  (up)

# ============================================================================
# Server settings (WebSocket + HTTP)
# ============================================================================
server:
  bind_addr: "0.0.0.0:9090"   # listen on all interfaces, port 9090
  telemetry_default_hz: 30
  telemetry_max_hz: 100

# ============================================================================
# Power board (Robstride PowerBoard) — battery / rail telemetry
# ----------------------------------------------------------------------------
# Lives on its own CAN bus (can4 in the V2 wiring). The runtime polls the
# board at `poll_interval_ms` for a Type-03 status frame (battery V, motor
# rail V, board temperature, fault word) and republishes the result to
# every WS client through `Snapshot.power` / TelemetryFrame.power.
#
# Battery chemistry below describes the *pack we ship with* — a 13s2p
# Li-ion pack of 26× Molicel INR21700-P45B (NMC) cells, ~9.0 Ah nominal
# (2 × 4.5 Ah). The 2p parallel grouping doubles capacity and current
# headroom (up to ~90 A) but does NOT change voltage — only the 13s
# series count sets pack voltage. Per-cell endpoints: SOC-100% = 4.20 V
# (P45B full-charge), SOC-0% anchored at a conservative 3.00 V, giving a
# pack range of 13 × 4.20 = 54.6 V full → 13 × 3.00 = 39.0 V empty. The
# P45B datasheet hard cutoff is 2.50 V/cell; the pack BMS will trip on
# cell UVP before we ever reach the firmware's "0 %".
#
# The fuel gauge in the operator app is a linear interpolation between
# those endpoints. Unlike LFP, Li-ion (NMC) has a sloped, monotonic OCV
# curve, so a linear V→SOC estimate tracks reasonably well across most of
# the range — but it still reads low under heavy current draw (the P45B
# sags hard at 45 A/cell) and is non-linear near the top/bottom knees, so
# treat it as a "full / mostly full / getting low / dead" indicator rather
# than a precise gauge. The on-pack BMS does coulomb counting and is the
# authoritative SOC source if you need it — wire that in via the BMS's
# protocol and replace this block with a coulomb-counter feed when
# accuracy matters.
#
# Comment out this block (or delete it) to skip power telemetry entirely;
# the runtime will still come up cleanly without a power board attached.
# ============================================================================
power:
  can_interface: can4
  power_id: 170             # Robstride PowerBoard default address 0xAA (param 6006)
  poll_interval_ms: 1000    # 1 Hz status polling — keeps the bus quiet
  battery_cells: 13         # 13s series count (2p adds capacity, not voltage) → 4.20 V × 13 = 54.6 V full
  cell_full_voltage: 4.20   # Molicel P45B (Li-ion NMC) full-charge voltage
  cell_empty_voltage: 3.00  # conservative empty anchor (P45B datasheet cutoff is 2.50 V)
