; PlatformIO Project Configuration File
;
; Teensy 4.1 CAN Bridge for Bebop Robot
;
; Build modes:
;   pio run -e sim        # Isaac Sim HIL (primary development mode)
;   pio run -e ros        # micro-ROS bridge (external policy runner)
;   pio run -e imu_test   # Standalone BNO085 IMU test (I2C)
;   pio run -e imu_spi_test  # Standalone BNO085 IMU test (SPI)
;   pio run -e imu_bridge    # BNO085 -> USB serial bridge (for Jetson)
;
; Upload: pio run -e <mode> --target upload
; Monitor: pio device monitor (or cat /dev/ttyACM2)

[platformio]
default_envs = sim  ; Default to simulation mode

; =============================================================================
; COMMON SETTINGS
; =============================================================================
[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli

; Common libraries
lib_deps = 
    ; FlexCAN for Teensy 4.x
    https://github.com/tonton81/FlexCAN_T4.git
    adafruit/Adafruit BNO08x@^1.2.3

; =============================================================================
; SIM MODE: Isaac Sim hardware-in-the-loop (PRIMARY DEVELOPMENT MODE)
; - Receives sensor data from Isaac Sim via micro-ROS
; - Runs policy inference on Teensy
; - Sends commands back to Isaac Sim
; =============================================================================
[env:sim]
build_src_filter = 
    +<*>
    -<main.cpp>
    -<main_imu_test.cpp>
    -<main_imu_spi_test.cpp>
    -<main_imu_bridge.cpp>
    +<main_sim.cpp>

build_flags = 
    -D USB_DUAL_SERIAL
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -D SIM_MODE
    -O2
    -L.pio/libdeps/sim/micro_ros_arduino/src/imxrt1062/fpv5-d16-hard
    -lmicroros

lib_deps = 
    ${env.lib_deps}
    https://github.com/micro-ROS/micro_ros_arduino.git

board_build.extra_flags = 
    -DUSB_DUAL_SERIAL

; =============================================================================
; IMU TEST MODE: Standalone BNO085 over I2C
; - No CAN, no micro-ROS, no policy
; - Prints quaternion/gyro/accel/gravity + report rates to USB Serial
; - Monitor with: pio device monitor -e imu_test
; =============================================================================
[env:imu_test]
build_src_filter = 
    -<*>
    +<main_imu_test.cpp>

build_flags = 
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -D IMU_TEST_MODE
    -O2

; =============================================================================
; IMU SPI TEST MODE: Standalone BNO085 over SPI
; - No CAN, no micro-ROS, no policy
; - Set BNO085 straps PS1=1, PS0=1 for SPI mode
; - Monitor with: pio device monitor -e imu_spi_test
; =============================================================================
[env:imu_spi_test]
build_src_filter = 
    -<*>
    +<main_imu_spi_test.cpp>

build_flags = 
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -D IMU_SPI_TEST_MODE
    -O2

; =============================================================================
; IMU BRIDGE MODE: BNO085 over SPI -> USB serial (binary frames)
; - Reads the BNO085 with the shared BNO085_IMU driver
; - Streams fixed 52-byte binary frames on the primary USB Serial @ 200Hz
; - Human-readable diagnostics on SerialUSB1 (USB_DUAL_SERIAL)
; - Consumed on the Jetson by firmware/bebop-linux (imu.source: "serial")
; - Monitor debug with: pio device monitor -e imu_bridge (second ACM port)
; =============================================================================
[env:imu_bridge]
build_src_filter = 
    -<*>
    +<main_imu_bridge.cpp>

build_flags = 
    -D USB_DUAL_SERIAL
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -D IMU_BRIDGE_MODE
    -O2

board_build.extra_flags = 
    -DUSB_DUAL_SERIAL

; =============================================================================
; ROS MODE: Hardware deployment with micro-ROS
; - Runs policy inference on Teensy
; - Reads real sensors (IMU, motor encoders) via CAN
; - Publishes state to ROS2 via micro-ROS
; =============================================================================
[env:ros]
build_src_filter = 
    +<*>
    -<main_sim.cpp>
    -<main_imu_test.cpp>
    -<main_imu_spi_test.cpp>
    -<main_imu_bridge.cpp>

build_flags = 
    -D USB_DUAL_SERIAL
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -D ROS_MODE
    -O2
    -L.pio/libdeps/ros/micro_ros_arduino/src/imxrt1062/fpv5-d16-hard
    -lmicroros

lib_deps = 
    ${env.lib_deps}
    https://github.com/micro-ROS/micro_ros_arduino.git

board_build.extra_flags = 
    -DUSB_DUAL_SERIAL
