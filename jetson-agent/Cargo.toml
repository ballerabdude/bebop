[workspace]
resolver = "2"
members = [
    "bebop-agent",
    "bebop-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Bebop Robotics"]
repository = "https://github.com/your-org/bebop"

[workspace.dependencies]
# Async runtime
tokio   = { version = "1.40", features = ["full"] }
futures = "0.3"

# Errors / logging
anyhow             = "1.0"
thiserror          = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml  = "0.8"

# Protobuf
prost       = "0.13"
prost-build = "0.13"

# Setup control surface (protobuf-over-WS + status page). Same `axum 0.7`
# used by `bebop-linux`'s runtime server so the two stacks stay in sync.
axum       = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Local crates
bebop-proto = { path = "bebop-proto" }
