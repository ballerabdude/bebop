[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bebop-vision"
version = "0.1.0"
description = "Video perception pipeline for the bebop robot: navigable-path prediction + teacher tooling"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python>=4.10.0",
    "protobuf>=4.25",
    "mcap>=1.4",
    "pyorbbecsdk2==2.1.2",
    "pyyaml>=6",
    "torch>=2.5",
    "transformers>=4.55",
    "websockets>=12",
]

[project.optional-dependencies]
# Student-model runtime (§7.3): ONNX inference for --navd-model. CPU build
# on workstation/CI; on the Jetson use the GPU build instead
# (requirements-jetson.txt) — the two distributions share the
# site-packages/onnxruntime dir, so never install both into one venv.
runtime = [
    "onnxruntime>=1.20",
]
teacher = [
    "einops",
    "huggingface_hub>=0.26.0",
    "onnx",
    "pillow>=10",
    "pycocotools",
    "tensorrt>=11.0",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
]
# Workstation-side training only (--tb in train_navd.py): the Jetson never
# trains, so tensorboard stays out of the main dependency set.
train = [
    "tensorboard>=2.12",
]

[tool.setuptools.packages.find]
include = ["bebop_vision*"]