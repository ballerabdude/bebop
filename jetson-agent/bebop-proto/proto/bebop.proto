syntax = "proto3";

package bebop.v1;

// ---------------------------------------------------------------------------
// Setup / provisioning control surface.
//
// Carried over a binary WebSocket by `bebop-agent`'s setup server (see
// `bebop-agent/src/server.rs`). The `bebop-app` connects to the robot over
// the LAN once it is on Wi-Fi, or directly to the robot's SoftAP during
// first-time provisioning.
// ---------------------------------------------------------------------------

message ClientRequest {
  uint32 request_id = 1;
  oneof payload {
    GetDeviceInfoRequest         get_device_info          = 10;
    ScanWifiRequest              scan_wifi                = 11;
    SetWifiCredentialsRequest    set_wifi_credentials     = 12;
    GetWifiStatusRequest         get_wifi_status          = 13;
    SetRobotConfigRequest        set_robot_config         = 14;
    GetRobotConfigRequest        get_robot_config         = 15;
    GetNetworkConfigRequest      get_network_config       = 16;
    SetNetworkConfigRequest      set_network_config       = 17;
  }
}

message AgentResponse {
  uint32 request_id = 1;
  ResponseStatus status = 2;
  string message = 3; // human readable error/info
  oneof payload {
    DeviceInfo            device_info             = 10;
    WifiScanResult        wifi_scan_result        = 11;
    WifiStatus            wifi_status             = 12;
    RobotConfig           robot_config            = 13;
    NetworkConfig         network_config          = 14;
  }
}

enum ResponseStatus {
  RESPONSE_STATUS_UNSPECIFIED = 0;
  RESPONSE_STATUS_OK = 1;
  RESPONSE_STATUS_ERROR = 2;
  RESPONSE_STATUS_UNAUTHORIZED = 3;
  RESPONSE_STATUS_IN_PROGRESS = 4;
}

// ---------------------------------------------------------------------------
// Device info
// ---------------------------------------------------------------------------

message GetDeviceInfoRequest {}

message DeviceInfo {
  string serial_number = 1;
  string model = 2;             // e.g. "bebop-v1"
  string agent_version = 3;     // semver of bebop-agent
  string jetpack_version = 4;
  string hostname = 5;
}

// ---------------------------------------------------------------------------
// Wi-Fi provisioning
// ---------------------------------------------------------------------------

message ScanWifiRequest {}

message WifiNetwork {
  string ssid = 1;
  int32  signal_dbm = 2;
  string security = 3; // "WPA2", "WPA3", "OPEN", ...
  bool   saved = 4;
}

message WifiScanResult {
  repeated WifiNetwork networks = 1;
}

message SetWifiCredentialsRequest {
  string ssid = 1;
  string password = 2;
  bool   hidden = 3;
}

message GetWifiStatusRequest {}

message WifiStatus {
  bool   connected = 1;
  string ssid = 2;
  string ip_address = 3;
  int32  signal_dbm = 4;
}

// ---------------------------------------------------------------------------
// Robot configuration
// ---------------------------------------------------------------------------

message RobotConfig {
  string robot_name = 1;
  string owner_id = 2;
  string timezone = 3;
  map<string, string> extra = 100;
}

message SetRobotConfigRequest {
  RobotConfig config = 1;
}

message GetRobotConfigRequest {}

// ---------------------------------------------------------------------------
// Network mode
//
// `mode` is one of:
//   * "auto"   — join a known network; fall back to the SoftAP if none
//                connects within the configured timeout.
//   * "client" — only ever act as a Wi-Fi client (no SoftAP).
//   * "ap"     — always host the SoftAP.
//
// `ap_ssid` and `ap_address` are read-only snapshots filled in by the
// agent so the app can render/join the setup network.
// ---------------------------------------------------------------------------

message NetworkConfig {
  string mode = 1;
  string ap_ssid = 2;
  string ap_address = 3;
}

message GetNetworkConfigRequest {}

message SetNetworkConfigRequest {
  NetworkConfig config = 1;
}
